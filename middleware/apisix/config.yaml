# NOTE: this file must be rendered with envsubst (or a config-management
# equivalent) at deploy time — APISIX does not expand ${VAR} itself.
# APISIX_ADMIN_KEY must be provisioned from the secret manager; there is no
# default. Never commit a real admin key here.
apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_admin: true
  admin_key:
    - name: admin
      key: "${APISIX_ADMIN_KEY:?must be set — provision via secret manager, no default admin key allowed}"
      role: admin

etcd:
  host:
    - "http://apisix-etcd:2379"
  prefix: "/apisix"
  timeout: 30

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: "0.0.0.0"
      port: 9091

plugins:
  - real-ip
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - ext-plugin-pre-req
  - fault-injection
  - mocking
  - serverless-pre-function
  - cors
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - csrf
  - uri-blocker
  - request-validation
  - openid-connect
  - cas-auth
  - authz-casbin
  - authz-casdoor
  - wolf-rbac
  - ldap-auth
  - hmac-auth
  - basic-auth
  - jwt-auth
  - key-auth
  - consumer-restriction
  - forward-auth
  - opa
  - authz-keycloak
  - proxy-cache
  - body-transformer
  - proxy-mirror
  - proxy-rewrite
  - api-breaker
  - limit-conn
  - limit-count
  - limit-req
  - gzip
  - server-info
  - traffic-split
  - redirect
  - response-rewrite
  - kafka-logger
  - http-logger
  - prometheus
  - datadog
  - echo
  - loggly
  - error-log-logger
  - syslog
  - log-rotate
  - skywalking
  - opentelemetry
  - ext-plugin-post-req
  - ext-plugin-post-resp
