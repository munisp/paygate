# PayGate NextHub — APISIX Route Configurations (Wave 219)
# All routes use:
#   - key-auth plugin for API key authentication
#   - rate-limiting plugin (per-domain quotas)
#   - opentelemetry plugin for distributed tracing
#   - response-rewrite plugin for protocol version headers
#
# Upstream naming: nexthub-<domain>-<port>
# All upstreams are registered in APISIX service discovery (Consul/K8s)

---
# ─── Healthcare / FHIR R4 + Medplum ─────────────────────────────────────────
routes:
  - id: nexthub-fhir-patient
    uri: /nexthub/healthcare/fhir/Patient/*
    methods: [GET, POST, PUT, PATCH, DELETE]
    upstream_id: nexthub-healthcare-8080
    plugins:
      key-auth: {}
      limit-req:
        rate: 100
        burst: 20
        key: consumer_name
        rejected_code: 429
      opentelemetry:
        sampler: { name: always_on }
      response-rewrite:
        headers:
          X-FHIR-Version: "R4"
          X-Protocol: "HL7-FHIR-R4"

  - id: nexthub-fhir-claim
    uri: /nexthub/healthcare/fhir/Claim/*
    methods: [GET, POST, PUT]
    upstream_id: nexthub-healthcare-8080
    plugins:
      key-auth: {}
      limit-req:
        rate: 200
        burst: 50
        key: consumer_name
        rejected_code: 429
      opentelemetry:
        sampler: { name: always_on }
      response-rewrite:
        headers:
          X-FHIR-Version: "R4"
          X-Protocol: "HL7-FHIR-R4"

  - id: nexthub-fhir-coverage
    uri: /nexthub/healthcare/fhir/Coverage/*
