# PayGate NextHub — Kafka Topic Definitions (Wave 219)
# All topics use:
#   - Avro schema registry (Confluent Schema Registry compatible)
#   - Compaction: delete (event log, not compacted)
#   - Replication factor: 3 (production), 1 (dev)
#   - Retention: 7 days default, 90 days for audit/compliance topics
#
# Topic naming convention:
#   paygate.<domain>.<entity>.<event>
#   e.g., paygate.healthcare.claim.submitted

---
# ─── Healthcare (Wave 212 / FHIR R4) ─────────────────────────────────────────
topics:
  - name: paygate.healthcare.claim.submitted
    partitions: 12
    replication: 3
    retention_ms: 604800000  # 7 days
    schema: healthcare_claim_submitted_v1
    description: "FHIR R4 Claim resource submitted for adjudication"

  - name: paygate.healthcare.claim.adjudicated
    partitions: 12
    replication: 3
    retention_ms: 604800000
    schema: healthcare_claim_adjudicated_v1
    description: "Claim adjudication result (approved/denied/partial)"

  - name: paygate.healthcare.claim.disbursed
    partitions: 12
    replication: 3
    retention_ms: 604800000
    schema: healthcare_claim_disbursed_v1
    description: "TigerBeetle disbursement to provider confirmed"

  - name: paygate.healthcare.eligibility.checked
    partitions: 6
    replication: 3
    retention_ms: 604800000
    schema: healthcare_eligibility_v1
    description: "NHIA/HMO eligibility check result"

  - name: paygate.healthcare.fhir.resource.created
    partitions: 6
    replication: 3
    retention_ms: 2592000000  # 30 days
    schema: fhir_resource_event_v1
    description: "FHIR R4 resource created/updated in Medplum"

  - name: paygate.healthcare.fhir.resource.updated
    partitions: 6
    replication: 3
    retention_ms: 2592000000
    schema: fhir_resource_event_v1
    description: "FHIR R4 resource update event"

