  - name: paygate.insurance.premium.failed
    partitions: 6
    replication: 3
    retention_ms: 604800000
    schema: insurance_premium_failed_v1
    description: "Premium collection failed — lapse risk triggered"

  - name: paygate.insurance.claim.filed
    partitions: 12
    replication: 3
    retention_ms: 7776000000
    schema: insurance_claim_v1
    description: "Insurance claim filed (ACORD FNOL)"

  - name: paygate.insurance.claim.paid
    partitions: 12
    replication: 3
    retention_ms: 7776000000
    schema: insurance_claim_paid_v1
    description: "Claim payout disbursed via TigerBeetle"

  - name: paygate.insurance.lapse.risk
    partitions: 6
    replication: 3
    retention_ms: 604800000
    schema: insurance_lapse_risk_v1
    description: "ML lapse risk score exceeds threshold"

