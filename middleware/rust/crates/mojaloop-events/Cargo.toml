[package]
name = "mojaloop-events"
version = "0.1.0"
edition = "2021"
description = "Mojaloop FSPIOP event serialisation, Fluvio producer, and TigerBeetle settlement for PayGate"
authors = ["PayGate Engineering <engineering@paygate.ng>"]

[[bin]]
name = "mojaloop-settlement-service"
path = "src/main.rs"

[lib]
name = "mojaloop_events"
path = "src/lib.rs"

[dependencies]
# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Fluvio native client
fluvio = "0.22"

# TigerBeetle client
tigerbeetle-unofficial = "0.15"

# HTTP server (for health + metrics endpoint)
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# Kafka consumer (for receiving transfer.completed events from Go bridge)
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Tracing / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Environment
dotenvy = "0.15"

[dev-dependencies]
tokio-test = "0.4"
