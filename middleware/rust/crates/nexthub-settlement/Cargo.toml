[package]
name = "nexthub-settlement"
version = "0.1.0"
edition = "2021"
description = "PayGate NextHub TigerBeetle settlement gRPC service"
authors = ["PayGate Engineering <eng@paygate.ng>"]
license = "MIT"

[[bin]]
name = "nexthub-settlement"
path = "src/main.rs"

[lib]
name = "nexthub_settlement"
path = "src/lib.rs"

[dependencies]
# TigerBeetle client
tigerbeetle-unofficial = { version = "0.4", features = ["async"] }

# gRPC server
tonic = { version = "0.12", features = ["transport", "tls"] }
tonic-reflection = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.24", features = ["trace"] }
opentelemetry-otlp = { version = "0.17", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.25"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Config
config = "0.14"

# Fluvio producer
fluvio = { version = "0.22", optional = true }

[features]
default = ["fluvio-events"]
fluvio-events = ["fluvio"]

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
