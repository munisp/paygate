---
# Insider Threat Engine (Rust) — Deployment + Service + HPA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insider-threat-engine
  namespace: paygate
  labels:
    app: insider-threat-engine
    tier: security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insider-threat-engine
  template:
    metadata:
      labels:
        app: insider-threat-engine
        tier: security
    spec:
      containers:
        - name: insider-threat-engine
          image: paygate/insider-threat-engine:1.0.0
          ports:
            - containerPort: 8300
              name: http
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: REDIS_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8300
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8300
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: insider-threat-engine
  namespace: paygate
spec:
  selector:
    app: insider-threat-engine
  ports:
    - port: 8300
      targetPort: 8300
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insider-threat-engine-hpa
  namespace: paygate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: insider-threat-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# UEBA Service (Python) — Deployment + Service + HPA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ueba-service
  namespace: paygate
  labels:
    app: ueba-service
    tier: security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ueba-service
  template:
    metadata:
      labels:
        app: ueba-service
        tier: security
    spec:
      containers:
        - name: ueba-service
          image: paygate/ueba-service:1.0.0
          ports:
            - containerPort: 8301
              name: http
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: REDIS_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: RUST_ENGINE_URL
              value: "http://insider-threat-engine:8300"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8301
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8301
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ueba-service
  namespace: paygate
spec:
  selector:
    app: ueba-service
  ports:
    - port: 8301
      targetPort: 8301
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ueba-service-hpa
  namespace: paygate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ueba-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
