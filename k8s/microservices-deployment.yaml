    metadata:
      labels:
        app: paygate-portal
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: portal
          image: paygate/portal:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
