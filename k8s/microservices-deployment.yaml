---
# =============================================================================
# PayGate Microservices — Kubernetes Deployments
# Covers: push-service, ussd-gateway, fraud-scoring, consumer-outbox-relay,
#         sync-relay (Go), lakehouse-audit, mpesa-connector, kiosk-health,
#         payroll-service, usdc-lakehouse-consumer
#
# All services read credentials from the paygate-secrets Secret.
# kubectl create secret generic paygate-secrets \
#   --from-literal=DATABASE_URL='mysql://...' \
#   --from-literal=REDIS_URL='redis://...' \
#   --from-literal=KAFKA_BOOTSTRAP_SERVERS='kafka-1:9092,kafka-2:9092' \
#   --from-literal=FIREBASE_PROJECT_ID='paygate-prod' \
#   --from-literal=FIREBASE_CREDENTIALS_JSON='{"type":"service_account",...}' \
#   --from-literal=APNS_KEY_ID='ABCDEF1234' \
#   --from-literal=APNS_TEAM_ID='TEAMID1234' \
#   --from-literal=APNS_PRIVATE_KEY='-----BEGIN PRIVATE KEY-----...' \
#   --from-literal=APNS_BUNDLE_ID='com.paygate.consumer' \
#   --from-literal=VTPASS_API_KEY='...' \
#   --from-literal=VTPASS_SECRET_KEY='...' \
#   --from-literal=TERMII_API_KEY='...' \
#   --from-literal=YOUVERIFY_API_KEY='...' \
#   --from-literal=INTERNAL_API_KEY='...' \
#   --from-literal=MIDDLEWARE_INTERNAL_KEY='...' \
#   --from-literal=TIGERBEETLE_ADDRESS='tb-1:3902,tb-2:3902,tb-3:3902' \
#   --from-literal=MOJALOOP_URL='https://ml-api-adapter.paygate.ng' \
#   --from-literal=MOJALOOP_API_KEY='...' \
#   --from-literal=NIBSS_GATEWAY_URL='https://nibss-nip.paygate.ng' \
#   --from-literal=NIBSS_SECRET_KEY='...' \
#   --from-literal=NIBSS_INSTITUTION_CODE='999999' \
#   --from-literal=SMTP_HOST='smtp.paygate.ng' \
#   --from-literal=SMTP_PORT='587' \
#   --from-literal=SMTP_USER='noreply@paygate.ng' \
#   --from-literal=SMTP_PASS='...' \
#   --from-literal=FLUVIO_ENDPOINT='fluvio:9003' \
#   --from-literal=TEMPORAL_HOST_PORT='temporal:7233' \
#   --from-literal=PERMIFY_URL='http://permify:3476' \
#   --from-literal=PERMIFY_API_KEY='...' \
#   --from-literal=KEYCLOAK_URL='https://auth.paygate.ng' \
#   --from-literal=KEYCLOAK_REALM='paygate' \
#   --from-literal=KEYCLOAK_CLIENT_ID='merchant-portal' \
#   --from-literal=KEYCLOAK_CLIENT_SECRET='...' \
#   --from-literal=VAPID_PUBLIC_KEY='...' \
#   --from-literal=VAPID_PRIVATE_KEY='...' \
#   --from-literal=VAPID_SUBJECT='mailto:ops@paygate.ng' \
#   --from-literal=STRIPE_SECRET_KEY='sk_live_...' \
#   --from-literal=STRIPE_WEBHOOK_SECRET='whsec_...' \
#   --from-literal=PORTAL_TRPC_URL='http://paygate-portal-svc:3000/api/trpc' \
#   --from-literal=MERCHANT_PORTAL_URL='http://paygate-portal-svc:3000' \
#   --from-literal=PAYMENT_LINK_BASE_URL='https://pay.paygate.ng'
# =============================================================================

# ─── Namespace ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: paygate
  labels:
    app.kubernetes.io/part-of: paygate

---
# ─── Push Service (Python FCM/APNs) ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: push-service
  namespace: paygate
  labels:
    app: push-service
    component: notification
spec:
  replicas: 2
  selector:
    matchLabels:
      app: push-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: push-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: push-service
          image: paygate/push-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8096
          env:
            - name: PORT
              value: "8096"
            - name: LOG_LEVEL
              value: "info"
            - name: APNS_BUNDLE_ID
              value: "com.paygate.consumer"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: INTERNAL_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: DATABASE_URL
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: FIREBASE_PROJECT_ID
            - name: FIREBASE_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: FIREBASE_CREDENTIALS_JSON
            - name: APNS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: APNS_KEY_ID
            - name: APNS_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: APNS_TEAM_ID
            - name: APNS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: APNS_PRIVATE_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: push-service
  namespace: paygate
spec:
  selector:
    app: push-service
  ports:
    - port: 8096
      targetPort: 8096
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: push-service-pdb
  namespace: paygate
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: push-service

---
# ─── USSD Gateway (Python) ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ussd-gateway
  namespace: paygate
  labels:
    app: ussd-gateway
    component: channel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ussd-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ussd-gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ussd-gateway
          image: paygate/ussd-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8095
          env:
            - name: PORT
              value: "8095"
            - name: LOG_LEVEL
              value: "info"
            - name: PORTAL_BASE_URL
              value: "http://paygate-portal-svc:3000"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: MIDDLEWARE_INTERNAL_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ussd-gateway
  namespace: paygate
spec:
  selector:
    app: ussd-gateway
  ports:
    - port: 8095
      targetPort: 8095
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ussd-gateway-pdb
  namespace: paygate
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ussd-gateway

---
# ─── Fraud Scoring (Python ML) ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-scoring
  namespace: paygate
  labels:
    app: fraud-scoring
    component: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-scoring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fraud-scoring
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: fraud-scoring
          image: paygate/fraud-scoring:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: LOG_LEVEL
              value: "info"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: INTERNAL_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-scoring
  namespace: paygate
spec:
  selector:
    app: fraud-scoring
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraud-scoring-pdb
  namespace: paygate
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fraud-scoring

---
# ─── Consumer Outbox Relay (Go) ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-outbox-relay
  namespace: paygate
  labels:
    app: consumer-outbox-relay
    component: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-outbox-relay
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: consumer-outbox-relay
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: consumer-outbox-relay
          image: paygate/go-bridge:latest
          imagePullPolicy: Always
          command: ["/app/consumer-outbox-relay"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: DATABASE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: FLUVIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: FLUVIO_ENDPOINT
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: INTERNAL_API_KEY
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

---
# ─── Sync Relay (Go — offline POS mobile sync) ───────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-relay
  namespace: paygate
  labels:
    app: sync-relay
    component: relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sync-relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sync-relay
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: sync-relay
          image: paygate/go-bridge:latest
          imagePullPolicy: Always
          command: ["/app/sync-relay"]
          ports:
            - containerPort: 8097
          env:
            - name: PORT
              value: "8097"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: REDIS_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: INTERNAL_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
