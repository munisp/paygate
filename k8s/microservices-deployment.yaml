    metadata:
      labels:
        app: paygate-portal
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: portal
          image: paygate/portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
