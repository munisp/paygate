---
# ─── Lakehouse Audit (Python Delta Lake) ─────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-audit
  namespace: paygate
  labels:
    app: lakehouse-audit
    component: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lakehouse-audit
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: lakehouse-audit
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: lakehouse-audit
          image: paygate/lakehouse-audit:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8098
          env:
            - name: PORT
              value: "8098"
            - name: LOG_LEVEL
              value: "info"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: INTERNAL_API_KEY
            - name: DELTA_LAKE_PATH
              value: "/data/delta"
          volumeMounts:
            - name: delta-data
              mountPath: /data/delta
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: delta-data
          persistentVolumeClaim:
            claimName: lakehouse-pvc

---
# ─── M-Pesa Connector (Python) ───────────────────────────────────────────────
