  namespace: paygate
  labels:
    app: paygate-portal
    component: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: paygate-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
