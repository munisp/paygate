    metadata:
      labels:
        app: mpesa-connector
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mpesa-connector
          image: paygate/mpesa-connector:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8099
          env:
            - name: PORT
              value: "8099"
            - name: LOG_LEVEL
              value: "info"
            - name: BRIDGE_URL
              value: "http://paygate-go-bridge-svc:8080"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: INTERNAL_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
