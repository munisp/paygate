  namespace: paygate
  labels:
    app: sync-relay
    component: relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sync-relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sync-relay
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: sync-relay
          image: paygate/go-bridge:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/app/sync-relay"]
          ports:
            - containerPort: 8097
          env:
            - name: PORT
              value: "8097"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: REDIS_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: INTERNAL_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
