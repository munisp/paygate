# ServiceMonitor — configures Prometheus to scrape metrics from PayGate
# Requires prometheus-operator to be installed in the cluster
# Apply with: kubectl apply -f k8s/service-monitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paygate-metrics
  namespace: paygate
  labels:
    app: paygate-merchant-portal
    release: prometheus  # Must match the Prometheus operator's serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: paygate-merchant-portal
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
---
# PrometheusRule — alerting rules for PayGate
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paygate-alerts
  namespace: paygate
  labels:
    app: paygate-merchant-portal
    release: prometheus
spec:
  groups:
    - name: paygate.rules
      rules:
        - alert: PayGateHighErrorRate
          expr: |
            rate(http_requests_total{job="paygate-merchant-portal",status=~"5.."}[5m])
            / rate(http_requests_total{job="paygate-merchant-portal"}[5m]) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PayGate error rate > 5%"
            description: "HTTP 5xx error rate is {{ $value | humanizePercentage }} for the last 5 minutes."

        - alert: PayGateHighLatency
          expr: |
            histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="paygate-merchant-portal"}[5m])) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PayGate P95 latency > 2s"
            description: "P95 request latency is {{ $value }}s."

        - alert: PayGatePodDown
          expr: |
            kube_deployment_status_replicas_available{deployment="paygate-merchant-portal",namespace="paygate"} < 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PayGate has fewer than 2 available replicas"
            description: "Only {{ $value }} replicas are available. Minimum is 2."

        - alert: PayGateHighMemoryUsage
          expr: |
            container_memory_usage_bytes{namespace="paygate",container="paygate-merchant-portal"}
            / container_spec_memory_limit_bytes{namespace="paygate",container="paygate-merchant-portal"} > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PayGate memory usage > 85%"
            description: "Container memory usage is {{ $value | humanizePercentage }} of limit."

        - alert: PayGateDatabaseConnectionPoolExhausted
          expr: |
            paygate_db_pool_waiting_connections{job="paygate-merchant-portal"} > 10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Database connection pool exhausted"
            description: "{{ $value }} connections waiting for a DB pool slot."

---
# ─── Insider Threat & Security Alerting Rules ─────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paygate-insider-threat-alerts
  namespace: paygate
  labels:
    app: paygate-merchant-portal
    release: prometheus
spec:
  groups:
    - name: insider_threat
      interval: 30s
      rules:
        - alert: InsiderThreatHighRiskScore
          expr: |
            insider_threat_risk_score > 80
          for: 1m
          labels:
            severity: critical
            team: security
          annotations:
            summary: "High insider threat risk score detected"
            description: "Actor {{ $labels.actor_id }} has risk score {{ $value }} (threshold 80) on action {{ $labels.action }}"

        - alert: InsiderThreatVelocityBreach
          expr: |
            rate(insider_threat_velocity_breaches_total[5m]) > 0
          for: 0m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "Insider threat velocity limit breached"
            description: "Actor {{ $labels.actor_id }} exceeded velocity limit for action {{ $labels.action }}"

        - alert: InsiderThreatApprovalQueueDepth
          expr: |
            insider_threat_pending_approvals > 20
          for: 5m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "Insider threat approval queue is backing up"
            description: "{{ $value }} pending dual-control approvals — queue may be stalling"

        - alert: InsiderThreatSessionBindingViolation
          expr: |
            rate(insider_threat_session_violations_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
            team: security
          annotations:
            summary: "Session binding violation detected"
            description: "Session fingerprint mismatch for actor {{ $labels.actor_id }} — possible credential theft"

        - alert: UEBAServiceDown
          expr: |
            up{job="ueba-service"} == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "UEBA service is down"
            description: "The Python UEBA behavioural analytics service has been unreachable for 2 minutes"

        - alert: InsiderThreatEngineDown
          expr: |
            up{job="insider-threat-engine"} == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Insider threat Rust engine is down"
            description: "The Rust insider threat scoring engine has been unreachable for 2 minutes"

        - alert: OpenSearchIndexerLag
          expr: |
            opensearch_indexer_kafka_consumer_lag > 10000
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "OpenSearch indexer Kafka consumer lag is high"
            description: "Consumer lag is {{ $value }} messages — audit log indexing is falling behind"

        - alert: WAFBlockRateSpike
          expr: |
            rate(openappsec_blocked_requests_total[5m]) > 10
          for: 2m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "WAF block rate spike detected"
            description: "OpenAppSec is blocking {{ $value }} req/s — possible active attack"

    - name: ueba_anomaly
      interval: 60s
      rules:
        - alert: UEBAAnomalyScoreHigh
          expr: |
            ueba_anomaly_score > 0.85
          for: 5m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "UEBA anomaly score elevated"
            description: "User {{ $labels.user_id }} has anomaly score {{ $value }} — behavioural deviation detected"

        - alert: UEBANewGeoCountry
          expr: |
            ueba_new_country_access_total > 0
          for: 0m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "Access from new country detected"
            description: "User {{ $labels.user_id }} accessed from new country {{ $labels.country }}"
