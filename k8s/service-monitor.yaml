# ServiceMonitor — configures Prometheus to scrape metrics from PayGate
# Requires prometheus-operator to be installed in the cluster
# Apply with: kubectl apply -f k8s/service-monitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paygate-metrics
  namespace: paygate
  labels:
    app: paygate-merchant-portal
    release: prometheus  # Must match the Prometheus operator's serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: paygate-merchant-portal
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
---
# PrometheusRule — alerting rules for PayGate
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paygate-alerts
  namespace: paygate
  labels:
    app: paygate-merchant-portal
    release: prometheus
spec:
  groups:
    - name: paygate.rules
      rules:
        - alert: PayGateHighErrorRate
          expr: |
            rate(http_requests_total{job="paygate-merchant-portal",status=~"5.."}[5m])
            / rate(http_requests_total{job="paygate-merchant-portal"}[5m]) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PayGate error rate > 5%"
            description: "HTTP 5xx error rate is {{ $value | humanizePercentage }} for the last 5 minutes."

        - alert: PayGateHighLatency
          expr: |
            histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="paygate-merchant-portal"}[5m])) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PayGate P95 latency > 2s"
            description: "P95 request latency is {{ $value }}s."

        - alert: PayGatePodDown
          expr: |
            kube_deployment_status_replicas_available{deployment="paygate-merchant-portal",namespace="paygate"} < 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PayGate has fewer than 2 available replicas"
            description: "Only {{ $value }} replicas are available. Minimum is 2."

        - alert: PayGateHighMemoryUsage
          expr: |
            container_memory_usage_bytes{namespace="paygate",container="paygate-merchant-portal"}
            / container_spec_memory_limit_bytes{namespace="paygate",container="paygate-merchant-portal"} > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PayGate memory usage > 85%"
            description: "Container memory usage is {{ $value | humanizePercentage }} of limit."

        - alert: PayGateDatabaseConnectionPoolExhausted
          expr: |
            paygate_db_pool_waiting_connections{job="paygate-merchant-portal"} > 10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Database connection pool exhausted"
            description: "{{ $value }} connections waiting for a DB pool slot."
