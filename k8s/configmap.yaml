apiVersion: v1
kind: ConfigMap
metadata:
  name: paygate-config
  namespace: paygate
  labels:
    app: paygate-merchant-portal
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  NIBSS_GATEWAY_URL: "https://nibss-gateway.paygate.ng"
  NIBSS_INSTITUTION_CODE: "000001"
  MOJALOOP_URL: "https://mojaloop.paygate.ng"
  PAYMENT_LINK_BASE_URL: "https://pay.paygate.ng"
  MERCHANT_PORTAL_URL: "https://merchant.paygate.ng"
  PORTAL_TRPC_URL: "https://merchant.paygate.ng/api/trpc"
  USSD_GATEWAY_URL: "https://ussd.paygate.ng"
  OAUTH_SERVER_URL: "https://auth.paygate.ng"
  VITE_OAUTH_PORTAL_URL: "https://auth.paygate.ng/portal"
  ALLOWED_ORIGINS: "https://merchant.paygate.ng,https://consumer.paygate.ng,https://admin.paygate.ng"
  OTEL_SERVICE_NAME: "paygate-merchant-portal"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  VTPASS_SANDBOX: "false"
