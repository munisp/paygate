apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paygate-merchant-portal
  namespace: paygate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paygate-merchant-portal
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: paygate-merchant-portal
  namespace: paygate
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: paygate-merchant-portal

