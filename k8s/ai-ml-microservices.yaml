---
# PayGate AI/ML & Fintech Microservices Kubernetes Deployment
# Covers: vector-store, cocoindex, knowledge-graph, art-reasoning, lakehouse-ai,
#         lakehouse-v2, cohort-analytics, settlement-forecast, tax-engine,
#         payroll, pension-nps, salary-accounts, insurance-pricing, cashback-rewards,
#         carbon-oracle, kyc-ocr, liveness-detection, soundbox, kiosk-health,
#         iso20022-parser, spark-compaction, usdc-lakehouse-consumer, wealth-management
apiVersion: v1
kind: Namespace
metadata:
  name: paygate-ai
  labels:
    app.kubernetes.io/part-of: paygate
---
# ─── Vector Store (Qdrant Wrapper) ───────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-store
  namespace: paygate
  labels:
    app: vector-store
    tier: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vector-store
  template:
    metadata:
      labels:
        app: vector-store
    spec:
      containers:
        - name: vector-store
          image: paygate/vector-store:latest
          ports:
            - containerPort: 8110
          env:
            - name: PORT
              value: "8110"
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: PG_DATABASE_URL
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: INTERNAL_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8110
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8110
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vector-store
  namespace: paygate
spec:
  selector:
    app: vector-store
  ports:
    - port: 8110
      targetPort: 8110
---
