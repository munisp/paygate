# ─── CronJob: GNN Model Retraining ────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gnn-model-retrain
  namespace: paygate
spec:
  schedule: "0 2 * * 0"  # Every Sunday at 2am
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: gnn-retrain
              image: paygate/lakehouse-ai:latest
              command: ["python", "-m", "gnn_trainer", "--mode=retrain", "--epochs=50"]
              env:
                - name: MINIO_ENDPOINT
                  value: "http://minio:9000"
                - name: PG_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: paygate-secrets
                      key: PG_DATABASE_URL
              resources:
                requests:
                  memory: "4Gi"
                  cpu: "2000m"
                limits:
                  memory: "8Gi"
                  cpu: "4000m"
---
# ─── CronJob: Parquet Compaction ──────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: parquet-compaction
  namespace: paygate
spec:
  schedule: "0 3 * * *"  # Every day at 3am
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: compaction
              image: paygate/spark-compaction:latest
              command: ["python", "-m", "compaction", "--mode=daily"]
              env:
                - name: MINIO_ENDPOINT
                  value: "http://minio:9000"
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: paygate-secrets
                      key: MINIO_ACCESS_KEY
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: paygate-secrets
                      key: MINIO_SECRET_KEY
              resources:
                requests:
                  memory: "2Gi"
                  cpu: "1000m"
                limits:
                  memory: "8Gi"
                  cpu: "4000m"
---
# ─── CronJob: Scheduled Reports Email ────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled-reports-email
  namespace: paygate
spec:
  schedule: "0 8 1 * *"  # 1st of every month at 8am
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report-emailer
              image: paygate/app:latest
              command: ["node", "scripts/run-scheduled-reports.mjs"]
              env:
                - name: PG_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: paygate-secrets
                      key: PG_DATABASE_URL
                - name: SMTP_HOST
                  valueFrom:
                    secretKeyRef:
                      name: paygate-secrets
                      key: SMTP_HOST
                - name: SMTP_USER
                  valueFrom:
                    secretKeyRef:
                      name: paygate-secrets
                      key: SMTP_USER
                - name: SMTP_PASS
                  valueFrom:
                    secretKeyRef:
                      name: paygate-secrets
                      key: SMTP_PASS
