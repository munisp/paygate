# =============================================================================
# PayGate Redis Production Configuration
# =============================================================================

# ─── Network ──────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ─── TLS (enable in production) ───────────────────────────────────────────────
# tls-port 6380
# tls-cert-file /etc/ssl/redis/redis.crt
# tls-key-file /etc/ssl/redis/redis.key
# tls-ca-cert-file /etc/ssl/redis/ca.crt
# tls-auth-clients yes

# ─── Authentication ───────────────────────────────────────────────────────────
# requirepass <set via REDIS_PASSWORD env var — do not hardcode>

# ─── Memory management ────────────────────────────────────────────────────────
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# ─── Persistence ──────────────────────────────────────────────────────────────
# AOF for durability (recommended for session/idempotency data)
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as backup
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename paygate-dump.rdb
dir /data

# ─── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/redis/redis.log

# ─── Slow log ─────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ─── Keyspace notifications (for TTL expiry events) ───────────────────────────
notify-keyspace-events "Ex"

# ─── Cluster (enable for Redis Cluster mode) ──────────────────────────────────
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 15000
