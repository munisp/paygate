[databases]
; Production PostgreSQL — replace with actual host/port/dbname
paygate = host=pg-primary.internal port=5432 dbname=paygate

[pgbouncer]
; ─── Listen ───────────────────────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 5432

; ─── Authentication ───────────────────────────────────────────────────────────
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ─── Pool mode: transaction (recommended for stateless APIs) ──────────────────
pool_mode = transaction
default_pool_size = 50
max_client_conn = 500
reserve_pool_size = 10
reserve_pool_timeout = 5

; ─── Connection limits ────────────────────────────────────────────────────────
max_db_connections = 100
max_user_connections = 100

; ─── Timeouts ─────────────────────────────────────────────────────────────────
server_connect_timeout = 15
server_idle_timeout = 600
client_idle_timeout = 0
query_timeout = 30
query_wait_timeout = 120

; ─── TLS (required in production) ────────────────────────────────────────────
server_tls_sslmode = require
server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt

; ─── Logging ──────────────────────────────────────────────────────────────────
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; ─── Admin interface ──────────────────────────────────────────────────────────
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

; ─── Ignore startup parameters (required for some ORMs) ──────────────────────
ignore_startup_parameters = extra_float_digits,options
