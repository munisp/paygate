    scrape_interval: 30s
  - job_name: paygate-fraud-heatmap
    static_configs:
      - targets: ["fraud-heatmap:8120"]
    metrics_path: /metrics
    scrape_interval: 30s
  - job_name: paygate-minio
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster
