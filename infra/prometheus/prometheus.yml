global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: production
    project: paygate

rule_files:
  - alert-rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ─── PayGate Portal (Node.js) ─────────────────────────────────────────────
  - job_name: paygate-portal
    static_configs:
      - targets: ["portal-1:3000", "portal-2:3000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # ─── PayGate Go Bridge ────────────────────────────────────────────────────
  - job_name: paygate-bridge
    static_configs:
      - targets: ["bridge-1:8080", "bridge-2:8080"]
    metrics_path: /metrics
    scrape_interval: 15s

  # ─── PostgreSQL (via postgres_exporter) ───────────────────────────────────
  - job_name: postgresql
    static_configs:
      - targets: ["pg-exporter:9187"]
    scrape_interval: 30s

  # ─── Redis (via redis_exporter) ───────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s

  # ─── Kafka (via kafka_exporter) ───────────────────────────────────────────
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
    scrape_interval: 30s

  # ─── Python microservices ─────────────────────────────────────────────────
  - job_name: paygate-fraud-scoring
    static_configs:
      - targets: ["fraud-scoring:8083"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: paygate-ussd-gateway
    static_configs:
      - targets: ["ussd-gateway:8095"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: paygate-payroll
    static_configs:
      - targets: ["payroll-service:8093"]
    metrics_path: /metrics
    scrape_interval: 30s

  # ─── APISIX ───────────────────────────────────────────────────────────────
  - job_name: apisix
    static_configs:
      - targets: ["apisix:9091"]
    metrics_path: /apisix/prometheus/metrics
    scrape_interval: 15s

  # ─── Temporal ─────────────────────────────────────────────────────────────
  - job_name: temporal
    static_configs:
      - targets: ["temporal:8000"]
    metrics_path: /metrics
    scrape_interval: 30s
  # ─── Wave 78 New Feature Microservices ────────────────────────────────────
  - job_name: paygate-digital-gold
    static_configs:
      - targets: ["digital-gold:9020"]
    metrics_path: /metrics
    scrape_interval: 30s
  - job_name: paygate-mutual-funds
    static_configs:
      - targets: ["mutual-funds:9021"]
    metrics_path: /metrics
    scrape_interval: 30s
  - job_name: paygate-pension-nps
    static_configs:
      - targets: ["pension-nps:9022"]
    metrics_path: /metrics
    scrape_interval: 30s
  - job_name: paygate-cashback-rewards
    static_configs:
      - targets: ["cashback-rewards:9023"]
    metrics_path: /metrics
    scrape_interval: 30s
  - job_name: paygate-soundbox
    static_configs:
      - targets: ["soundbox:9024"]
    metrics_path: /metrics
    scrape_interval: 30s
  - job_name: paygate-wealth-management
    static_configs:
      - targets: ["wealth-management:9025"]
    metrics_path: /metrics
    scrape_interval: 30s
  - job_name: paygate-emi-service
    static_configs:
      - targets: ["emi-service:9026"]
    metrics_path: /metrics
    scrape_interval: 30s
  - job_name: paygate-bulk-collections
    static_configs:
      - targets: ["bulk-collections:9027"]
    metrics_path: /metrics
