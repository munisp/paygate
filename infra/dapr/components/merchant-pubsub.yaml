---
# Merchant Portal Pub/Sub Component
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: merchant-pubsub
  namespace: paygate
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "kafka:9092"
    - name: consumerGroup
      value: "paygate-merchant-portal"
    - name: authType
      value: "none"
    - name: initialOffset
      value: "newest"
    - name: maxMessageBytes
      value: "1048576"
    - name: disableTls
      value: "false"
---
# Settlement events subscription
apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: settlement-events-sub
  namespace: paygate
spec:
  pubsubname: merchant-pubsub
  topic: paygate.settlement.triggered
  route: /events/settlement
---
