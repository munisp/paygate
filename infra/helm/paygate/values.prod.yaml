# =============================================================================
# PayGate Helm Chart — Production Overrides
# Usage: helm upgrade --install paygate ./infra/helm/paygate \
#          -f values.yaml -f values.prod.yaml \
#          --namespace paygate --create-namespace
# =============================================================================

# ─── Portal ──────────────────────────────────────────────────────────────────
portal:
  replicaCount: 3
  image:
    tag: "1.0.0"  # Pin to specific release tag in production
  autoscaling:
    minReplicas: 3
    maxReplicas: 20
  env:
    NODE_ENV: production
    LOG_LEVEL: warn

# ─── Bridge ──────────────────────────────────────────────────────────────────
bridge:
  replicaCount: 3
  image:
    tag: "1.0.0"
  autoscaling:
    minReplicas: 3
    maxReplicas: 15

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
postgresql:
  primary:
    persistence:
      size: 200Gi
      storageClass: "premium-rwo"
    resources:
      requests:
        cpu: 2000m
        memory: 4Gi
      limits:
        cpu: 4000m
        memory: 8Gi

# ─── Redis ───────────────────────────────────────────────────────────────────
redis:
  architecture: replication
  replica:
    replicaCount: 2
  master:
    persistence:
      size: 20Gi

# ─── Ingress ─────────────────────────────────────────────────────────────────
ingress:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://portal.paygate.ng"

# ─── Monitoring ──────────────────────────────────────────────────────────────
monitoring:
  prometheus:
    retention: 30d
    storageSize: 100Gi
  grafana:
    persistence:
      size: 20Gi
