# ─── Rust Services ───────────────────────────────────────────────────────────
rustServices:
  billingEngine:
    enabled: true
    replicaCount: 2
    image: paygate/billing-engine:latest
    port: 8200
  creditScoring:
    enabled: true
    replicaCount: 2
    image: paygate/credit-scoring:latest
    port: 8201
  inventoryEngine:
    enabled: true
    replicaCount: 1
    image: paygate/inventory-engine:latest
    port: 8202
  loyaltyLedger:
    enabled: true
    replicaCount: 2
    image: paygate/loyalty-ledger:latest
    port: 8203
  tigerbeetleRecon:
    enabled: true
    replicaCount: 1
    image: paygate/tigerbeetle-recon:latest
    port: 8204
  walletFfi:
    enabled: true
    replicaCount: 2
    image: paygate/wallet-ffi:latest
    port: 8205

# ─── Monitoring ──────────────────────────────────────────────────────────────
monitoring:
  prometheus:
    enabled: true
    retention: 15d
    storageSize: 20Gi
  grafana:
    enabled: true
    adminPassword: ""  # Override in values.prod.yaml
    persistence:
      enabled: true
      size: 5Gi

# ─── Secrets ─────────────────────────────────────────────────────────────────
secrets:
  existingSecret: paygate-secrets

# ─── Service Account ─────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: paygate-sa
  annotations: {}

# ─── Pod Disruption Budget ───────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ─── Network Policy ──────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
