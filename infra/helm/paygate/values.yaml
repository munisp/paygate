# =============================================================================
# PayGate Helm Chart — Default Values
# Override with: helm install paygate ./infra/helm/paygate -f values.prod.yaml
# =============================================================================

# ─── Global ──────────────────────────────────────────────────────────────────
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# ─── Namespace ───────────────────────────────────────────────────────────────
namespace: paygate

# ─── Portal (Node.js / React) ────────────────────────────────────────────────
portal:
  enabled: true
  replicaCount: 2
  image:
    repository: paygate/portal
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    NODE_ENV: production
    LOG_LEVEL: info

# ─── Go Bridge ───────────────────────────────────────────────────────────────
bridge:
  enabled: true
  replicaCount: 2
  image:
    repository: paygate/go-bridge
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 800m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    username: paygate
    password: ""  # Override in values.prod.yaml or use existing secret
    database: paygate
    existingSecret: paygate-secrets
    secretKeys:
      adminPasswordKey: POSTGRES_PASSWORD
      userPasswordKey: POSTGRES_PASSWORD
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
  metrics:
    enabled: true

# ─── Redis ───────────────────────────────────────────────────────────────────
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: paygate-secrets
    existingSecretPasswordKey: REDIS_PASSWORD
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  metrics:
    enabled: true

# ─── Ingress ─────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: portal.paygate.ng
      paths:
        - path: /
          pathType: Prefix
          service: portal
          port: 3000
    - host: api.paygate.ng
      paths:
        - path: /v1
          pathType: Prefix
          service: bridge
          port: 8080
  tls:
    - secretName: paygate-tls
      hosts:
        - portal.paygate.ng
        - api.paygate.ng

