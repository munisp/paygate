apiVersion: 1

providers:
  - name: PayGate Dashboards
    orgId: 1
    folder: PayGate
    folderUid: paygate
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
