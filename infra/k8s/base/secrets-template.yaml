# ─── PayGate Kubernetes Secrets Template ──────────────────────────────────────
# This file is a TEMPLATE only. Do NOT commit real values.
# Usage:
#   1. Copy to secrets.yaml (gitignored)
#   2. Fill in real values (base64-encoded)
#   3. Apply: kubectl apply -f secrets.yaml -n paygate
#
# Generate base64: echo -n "your-value" | base64
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Secret
metadata:
  name: paygate-secrets
  namespace: paygate
  labels:
    app.kubernetes.io/name: paygate
type: Opaque
stringData:
  # ── Database ────────────────────────────────────────────────────────────────
  PG_DATABASE_URL: "postgresql://paygate:CHANGE_ME@postgres:5432/paygate"
  DATABASE_URL: "mysql://paygate:CHANGE_ME@tidb:4000/paygate"

  # ── Redis ───────────────────────────────────────────────────────────────────
  REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"

  # ── TigerBeetle ─────────────────────────────────────────────────────────────
  TIGERBEETLE_ADDRESS: "tigerbeetle-1:3901,tigerbeetle-2:3901,tigerbeetle-3:3901"

  # ── JWT / Auth ───────────────────────────────────────────────────────────────
  JWT_SECRET: "CHANGE_ME_min_32_chars_random_string"
  INTERNAL_API_KEY: "CHANGE_ME_internal_api_key"
  MIDDLEWARE_INTERNAL_KEY: "CHANGE_ME_middleware_key"

  # ── OAuth / Manus ────────────────────────────────────────────────────────────
  VITE_APP_ID: "CHANGE_ME_manus_app_id"
  OWNER_OPEN_ID: "CHANGE_ME_owner_open_id"
  OWNER_NAME: "PayGate Admin"

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME_keycloak_client_secret"

  # ── Stripe ───────────────────────────────────────────────────────────────────
  STRIPE_SECRET_KEY: "sk_test_CHANGE_ME"
  VITE_STRIPE_PUBLISHABLE_KEY: "pk_test_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"

  # ── MinIO / S3 ───────────────────────────────────────────────────────────────
  MINIO_ROOT_USER: "CHANGE_ME_minio_user"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_minio_password_min_8_chars"
  AWS_ACCESS_KEY_ID: "CHANGE_ME_minio_user"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_minio_password_min_8_chars"

  # ── NIBSS ────────────────────────────────────────────────────────────────────
  NIBSS_INSTITUTION_CODE: "000001"
  NIBSS_SECRET_KEY: "CHANGE_ME_nibss_secret"
  NIBSS_WEBHOOK_SECRET: "CHANGE_ME_nibss_webhook_secret"
  NIP_API_KEY: "CHANGE_ME_nip_api_key"

  # ── Mojaloop ─────────────────────────────────────────────────────────────────
  MOJALOOP_API_KEY: "CHANGE_ME_mojaloop_api_key"
  MOJALOOP_URL: "https://ml-api-adapter.paygate.ng"

  # ── Permify ──────────────────────────────────────────────────────────────────
  PERMIFY_API_KEY: "CHANGE_ME_permify_api_key"

  # ── SMTP ─────────────────────────────────────────────────────────────────────
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "noreply@paygate.ng"
  SMTP_PASS: "CHANGE_ME_smtp_password"

  # ── Push Notifications ───────────────────────────────────────────────────────
  VAPID_PUBLIC_KEY: "CHANGE_ME_vapid_public_key"
  VAPID_PRIVATE_KEY: "CHANGE_ME_vapid_private_key"
  PUSH_SERVICE_KEY: "CHANGE_ME_push_service_key"
  PUSH_SERVICE_URL: "https://push.paygate.ng"

  # ── VTPass ───────────────────────────────────────────────────────────────────
  VTPASS_API_KEY: "CHANGE_ME_vtpass_api_key"
  VTPASS_SECRET_KEY: "CHANGE_ME_vtpass_secret_key"

  # ── Termii (SMS) ─────────────────────────────────────────────────────────────
  TERMII_API_KEY: "CHANGE_ME_termii_api_key"

  # ── YouVerify (KYC) ──────────────────────────────────────────────────────────
  YOUVERIFY_API_KEY: "CHANGE_ME_youverify_api_key"

  # ── Sync Relay ───────────────────────────────────────────────────────────────
  SYNC_RELAY_KEY: "CHANGE_ME_sync_relay_key"

  # ── Payout Approver ──────────────────────────────────────────────────────────
  PAYOUT_APPROVER_EMAIL: "approvals@paygate.ng"

  # ── Manus Built-in APIs ──────────────────────────────────────────────────────
  BUILT_IN_FORGE_API_KEY: "CHANGE_ME_forge_api_key"
  BUILT_IN_FORGE_API_URL: "https://api.manus.im"
  VITE_FRONTEND_FORGE_API_KEY: "CHANGE_ME_frontend_forge_key"
  VITE_FRONTEND_FORGE_API_URL: "https://api.manus.im"

  # ── Analytics ────────────────────────────────────────────────────────────────
  VITE_ANALYTICS_ENDPOINT: "https://analytics.paygate.ng"
  VITE_ANALYTICS_WEBSITE_ID: "CHANGE_ME_analytics_id"
