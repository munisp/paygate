---
# PayGate Secrets Template
# IMPORTANT: Replace all placeholder values before deploying to production.
# Use `kubectl create secret generic paygate-secrets --from-env-file=.env.prod -n paygate`
# OR use a secrets manager (Vault, AWS SSM, GCP Secret Manager) with External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: paygate-secrets
  namespace: paygate
  labels:
    app.kubernetes.io/name: paygate
  annotations:
    # Rotate these secrets every 90 days
    paygate.ng/rotate-after: "90d"
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://paygate:CHANGE_ME@postgres:5432/paygate"
  PG_DATABASE_URL: "postgresql://paygate:CHANGE_ME@postgres:5432/paygate"

  # Auth
  JWT_SECRET: "CHANGE_ME_32_CHARS_MINIMUM_SECRET_KEY"

  # Stripe
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  VITE_STRIPE_PUBLISHABLE_KEY: "pk_live_CHANGE_ME"

  # Redis
  REDIS_URL: "redis://:CHANGE_ME@redis-cluster:6379/0"

  # NIBSS
  NIBSS_INSTITUTION_CODE: "000001"
  NIBSS_SECRET_KEY: "CHANGE_ME"
  NIBSS_WEBHOOK_SECRET: "CHANGE_ME"
  NIP_API_KEY: "CHANGE_ME"

  # Permify
  PERMIFY_API_KEY: "CHANGE_ME"

  # Keycloak
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME"

  # SMTP
  SMTP_HOST: "smtp.paygate.ng"
  SMTP_PORT: "587"
  SMTP_USER: "noreply@paygate.ng"
  SMTP_PASS: "CHANGE_ME"

  # Push Notifications
  VAPID_PUBLIC_KEY: "CHANGE_ME"
  VAPID_PRIVATE_KEY: "CHANGE_ME"

  # Middleware
  MIDDLEWARE_INTERNAL_KEY: "CHANGE_ME_32_CHARS"

  # Sync relay
  SYNC_RELAY_KEY: "CHANGE_ME"

  # Manus built-in APIs
  BUILT_IN_FORGE_API_KEY: "CHANGE_ME"
  VITE_FRONTEND_FORGE_API_KEY: "CHANGE_ME"

  # External services
  MOJALOOP_API_KEY: "CHANGE_ME"
  YOUVERIFY_API_KEY: "CHANGE_ME"
  TERMII_API_KEY: "CHANGE_ME"
  VTPASS_API_KEY: "CHANGE_ME"
  VTPASS_SECRET_KEY: "CHANGE_ME"

  # Payout approver
  PAYOUT_APPROVER_EMAIL: "approver@paygate.ng"

  # Push service
  PUSH_SERVICE_KEY: "CHANGE_ME"
  PUSH_SERVICE_URL: "https://push.paygate.ng"

  # Internal API key
  INTERNAL_API_KEY: "CHANGE_ME"

  # TigerBeetle
  TIGERBEETLE_ADDRESS: "tigerbeetle:3902"
