---
apiVersion: v1
kind: Namespace
metadata:
  name: paygate
  labels:
    app.kubernetes.io/name: paygate
    app.kubernetes.io/managed-by: kustomize
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paygate-portal
  namespace: paygate
  labels:
    app: paygate-portal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paygate-go-bridge
  namespace: paygate
  labels:
    app: paygate-go-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paygate-secret-reader
  namespace: paygate
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paygate-portal-secret-reader
  namespace: paygate
subjects:
  - kind: ServiceAccount
    name: paygate-portal
    namespace: paygate
  - kind: ServiceAccount
    name: paygate-go-bridge
    namespace: paygate
roleRef:
  kind: Role
  name: paygate-secret-reader
  apiGroup: rbac.authorization.k8s.io
