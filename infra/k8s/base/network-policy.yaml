# ─── PayGate Kubernetes NetworkPolicy ────────────────────────────────────────
# Enforces defence-in-depth pod-to-pod traffic isolation.
# Requires a CNI plugin that supports NetworkPolicy (Calico, Cilium, Weave, etc.)
#
# Topology:
#   Ingress Controller → portal (3000)
#   portal             → go-bridge (8080), postgres (5432), redis (6379)
#   go-bridge          → postgres (5432), redis (6379), tigerbeetle (3902)
#   python-services    → postgres (5432)
#   rust-services      → postgres (5432), redis (6379)
#   monitoring         → all pods :metrics (9090)
#   All pods           → kube-dns (53/UDP+TCP)
# ─────────────────────────────────────────────────────────────────────────────

# ── 1. Default deny-all for the paygate namespace ────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: paygate
  labels:
    app.kubernetes.io/part-of: paygate
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}        # matches every pod in the namespace
  policyTypes:
    - Ingress
    - Egress

---
# ── 2. Allow all pods to reach kube-dns (DNS resolution) ─────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: paygate
  labels:
    app.kubernetes.io/part-of: paygate
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# ── 3. Portal — ingress from ingress-nginx, egress to bridge + data stores ───
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-network-policy
  namespace: paygate
  labels:
    app.kubernetes.io/part-of: paygate
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: paygate-portal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Accept traffic from the ingress-nginx controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
    # Accept health-check probes from Prometheus / monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
        - port: 3000
          protocol: TCP
  egress:
    # Reach go-bridge
    - to:
        - podSelector:
            matchLabels:
              app: paygate-go-bridge
      ports:
        - port: 8080
          protocol: TCP
    # Reach PostgreSQL / TiDB
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    # Reach Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    # Reach Stripe, Manus OAuth, and other external HTTPS APIs
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP

---
# ── 4. Go-Bridge — ingress from portal only, egress to data stores ────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-bridge-network-policy
  namespace: paygate
  labels:
    app.kubernetes.io/part-of: paygate
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: paygate-go-bridge
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the portal may call the bridge
    - from:
        - podSelector:
            matchLabels:
              app: paygate-portal
      ports:
        - port: 8080
          protocol: TCP
    # Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
  egress:
    # PostgreSQL / TiDB
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    # Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    # TigerBeetle
    - to:
        - podSelector:
            matchLabels:
              app: tigerbeetle
      ports:
        - port: 3902
          protocol: TCP
    # Kafka / Redpanda broker
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
          protocol: TCP
    # External HTTPS (NIBSS, Mojaloop, Termii, etc.)
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP

---
# ── 5. Python micro-services — ingress from portal/bridge, egress to postgres ─
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: python-services-network-policy
  namespace: paygate
  labels:
    app.kubernetes.io/part-of: paygate
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      tier: python-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: paygate-portal
        - podSelector:
            matchLabels:
              app: paygate-go-bridge
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP

---
# ── 6. Rust micro-services — ingress from portal/bridge, egress to postgres+redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rust-services-network-policy
  namespace: paygate
  labels:
    app.kubernetes.io/part-of: paygate
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      tier: rust-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: paygate-portal
        - podSelector:
            matchLabels:
              app: paygate-go-bridge
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP

---
# ── 7. PostgreSQL — ingress only from portal, bridge, python, rust services ───
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: paygate
  labels:
    app.kubernetes.io/part-of: paygate
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: paygate-portal
        - podSelector:
            matchLabels:
              app: paygate-go-bridge
        - podSelector:
            matchLabels:
              tier: python-service
        - podSelector:
            matchLabels:
              tier: rust-service
      ports:
        - port: 5432
          protocol: TCP
  egress: []   # postgres does not initiate outbound connections

---
# ── 8. Redis — ingress only from portal, bridge, and rust services ────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  namespace: paygate
  labels:
    app.kubernetes.io/part-of: paygate
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: paygate-portal
        - podSelector:
            matchLabels:
              app: paygate-go-bridge
        - podSelector:
            matchLabels:
              tier: rust-service
      ports:
        - port: 6379
          protocol: TCP
  egress: []

---
# ── 9. TigerBeetle — ingress only from go-bridge ─────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tigerbeetle-network-policy
  namespace: paygate
  labels:
    app.kubernetes.io/part-of: paygate
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: tigerbeetle
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: paygate-go-bridge
      ports:
        - port: 3902
          protocol: TCP
  egress: []

---
# ── 10. Kafka / Redpanda — ingress from bridge and python/rust producers ──────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-network-policy
  namespace: paygate
  labels:
    app.kubernetes.io/part-of: paygate
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: paygate-go-bridge
        - podSelector:
            matchLabels:
              tier: python-service
        - podSelector:
            matchLabels:
              tier: rust-service
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP   # TLS broker port
  egress: []

---
# ── 11. Monitoring (Prometheus) — ingress from nothing, egress to scrape all ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-network-policy
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: paygate
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
  egress:
    # Scrape paygate namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paygate
      ports:
        - port: 9090
          protocol: TCP
        - port: 3000
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8000
          protocol: TCP
    # Reach Alertmanager in same namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9093
          protocol: TCP
