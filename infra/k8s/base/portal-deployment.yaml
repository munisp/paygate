---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-portal
  namespace: paygate
  labels:
    app: paygate-portal
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: paygate-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: paygate-portal
        tier: frontend
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "paygate-portal"
        dapr.io/app-port: "3000"
        dapr.io/log-level: "info"
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: paygate-portal
      terminationGracePeriodSeconds: 30
      containers:
        - name: portal
          image: paygate/portal:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: JWT_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: MIDDLEWARE_BRIDGE_URL
              valueFrom:
                configMapKeyRef:
                  name: paygate-config
                  key: MIDDLEWARE_BRIDGE_URL
            - name: PORTAL_TRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: paygate-config
                  key: PORTAL_TRPC_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: paygate-portal
  namespace: paygate
  labels:
    app: paygate-portal
spec:
  selector:
    app: paygate-portal
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paygate-portal-hpa
  namespace: paygate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paygate-portal
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: paygate-portal-pdb
  namespace: paygate
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: paygate-portal
