---
# ─── MinIO Object Store ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paygate-minio
  namespace: paygate
spec:
  serviceName: paygate-minio
  replicas: 1
  selector:
    matchLabels:
      app: paygate-minio
  template:
    metadata:
      labels:
        app: paygate-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-11-07T00-52-20Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
            - containerPort: 9001
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paygate-minio
  namespace: paygate
spec:
  selector:
    app: paygate-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# ─── MinIO Bucket Init Job ─────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: paygate-minio-init
  namespace: paygate
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-11-17T19-35-25Z
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://paygate-minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
              mc mb --ignore-existing local/paygate-lakehouse &&
              mc mb --ignore-existing local/paygate-exports &&
              mc anonymous set download local/paygate-exports &&
              echo 'MinIO buckets ready'
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: MINIO_ROOT_PASSWORD
---
# ─── Lakehouse V2 (DuckDB/Delta Lake) ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-lakehouse-v2
  namespace: paygate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paygate-lakehouse-v2
  template:
    metadata:
      labels:
        app: paygate-lakehouse-v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8125"
    spec:
      containers:
        - name: lakehouse-v2
          image: paygate/lakehouse-v2:1.0.0
          ports:
            - containerPort: 8125
          env:
            - name: PORT
              value: "8125"
            - name: S3_ENDPOINT
              value: "http://paygate-minio:9000"
            - name: S3_BUCKET
              value: "paygate-lakehouse"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: AWS_REGION
              value: "us-east-1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: PG_DATABASE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: KAFKA_BOOTSTRAP_SERVERS
          livenessProbe:
            httpGet:
              path: /health
              port: 8125
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: paygate-lakehouse-v2
  namespace: paygate
spec:
  selector:
    app: paygate-lakehouse-v2
  ports:
    - port: 8125
      targetPort: 8125
---
