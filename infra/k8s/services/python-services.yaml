# ─── Spark Master ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-spark-master
  namespace: paygate
  labels:
    app: paygate-spark-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paygate-spark-master
  template:
    metadata:
      labels:
        app: paygate-spark-master
    spec:
      containers:
        - name: spark-master
          image: bitnami/spark:3.5
          env:
            - name: SPARK_MODE
              value: "master"
            - name: SPARK_RPC_AUTHENTICATION_ENABLED
              value: "no"
            - name: SPARK_RPC_ENCRYPTION_ENABLED
              value: "no"
            - name: SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED
              value: "no"
            - name: SPARK_SSL_ENABLED
              value: "no"
          ports:
            - containerPort: 7077
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: paygate-spark-master
  namespace: paygate
spec:
  selector:
    app: paygate-spark-master
  ports:
    - name: spark
      port: 7077
      targetPort: 7077
    - name: ui
      port: 8080
      targetPort: 8080
---
# ─── Spark Worker ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-spark-worker
  namespace: paygate
  labels:
    app: paygate-spark-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paygate-spark-worker
  template:
    metadata:
      labels:
        app: paygate-spark-worker
    spec:
      containers:
        - name: spark-worker
          image: bitnami/spark:3.5
          env:
            - name: SPARK_MODE
              value: "worker"
            - name: SPARK_MASTER_URL
              value: "spark://paygate-spark-master:7077"
            - name: SPARK_WORKER_MEMORY
              value: "2G"
            - name: SPARK_WORKER_CORES
              value: "2"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
