# ─── Trino ────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-trino
  namespace: paygate
  labels:
    app: paygate-trino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paygate-trino
  template:
