              name: web-ui
            - containerPort: 7077
              name: rpc
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: paygate-spark-master
  namespace: paygate
spec:
  selector:
    app: paygate-spark-master
  ports:
    - name: web-ui
      port: 8080
      targetPort: 8080
    - name: rpc
      port: 7077
      targetPort: 7077
---
# ─── Apache Spark Worker ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-spark-worker
  namespace: paygate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paygate-spark-worker
  template:
    metadata:
      labels:
        app: paygate-spark-worker
    spec:
      containers:
        - name: spark-worker
          image: bitnami/spark:3.5.3
          env:
            - name: SPARK_MODE
              value: worker
