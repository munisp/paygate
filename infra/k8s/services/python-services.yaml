              value: spark://paygate-spark-master:7077
            - name: SPARK_WORKER_MEMORY
              value: "4G"
            - name: SPARK_WORKER_CORES
              value: "4"
            - name: SPARK_RPC_AUTHENTICATION_ENABLED
              value: "no"
            - name: SPARK_RPC_ENCRYPTION_ENABLED
              value: "no"
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
---
# ─── Trino (Distributed SQL) ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-trino
  namespace: paygate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paygate-trino
  template:
    metadata:
      labels:
        app: paygate-trino
    spec:
      containers:
        - name: trino
          image: trinodb/trino:457
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: trino-catalog
              mountPath: /etc/trino/catalog
              readOnly: true
          livenessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "16Gi"
      volumes:
        - name: trino-catalog
          configMap:
            name: paygate-trino-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: paygate-trino
  namespace: paygate
spec:
  selector:
    app: paygate-trino
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paygate-trino-catalog
  namespace: paygate
data:
  lakehouse.properties: |
    connector.name=hive
    hive.metastore=file
    hive.metastore.catalog.dir=s3a://paygate-lakehouse/
    hive.s3.endpoint=http://paygate-minio:9000
    hive.s3.path-style-access=true
    hive.s3.aws-access-key=<CHANGE_ME: minio access key>
    hive.s3.aws-secret-key=<CHANGE_ME: minio secret key>
    hive.non-managed-table-writes-enabled=true
    delta.enable-non-concurrent-writes=true
  tpch.properties: |
    connector.name=tpch
---
# ─── Delta Lake Compaction CronJob ─────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paygate-delta-compaction
  namespace: paygate
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: spark-compaction
              image: paygate/spark-compaction:1.0.0
              env:
                - name: S3_BUCKET
                  value: "paygate-lakehouse"
                - name: S3_ENDPOINT
                  value: "http://paygate-minio:9000"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: paygate-secrets
                      key: MINIO_ROOT_USER
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: paygate-secrets
                      key: MINIO_ROOT_PASSWORD
                - name: SPARK_MASTER
                  value: "spark://paygate-spark-master:7077"
                - name: VACUUM_RETAIN_HOURS
                  value: "168"
                - name: COMPACT_TARGET_SIZE_MB
                  value: "128"
              resources:
                requests:
                  cpu: "500m"
                  memory: "2Gi"
                limits:
                  cpu: "2000m"
                  memory: "8Gi"

---
# ─── MinIO ────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-minio
  namespace: paygate
  labels:
    app: paygate-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paygate-minio
  template:
    metadata:
      labels:
        app: paygate-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-11-07T00-52-20Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: paygate-minio
  namespace: paygate
spec:
  selector:
    app: paygate-minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data-pvc
  namespace: paygate
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
# ─── MinIO Init Job ───────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: paygate-minio-init
  namespace: paygate
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -q -O- http://paygate-minio:9000/minio/health/ready; do echo waiting for minio; sleep 5; done']
      containers:
        - name: minio-init
          image: minio/mc:RELEASE.2024-11-05T11-29-45Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: MINIO_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              mc alias set minio http://paygate-minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD
              mc mb --ignore-existing minio/paygate-lakehouse
              mc mb --ignore-existing minio/paygate-exports
              mc mb --ignore-existing minio/paygate-audit
              mc anonymous set none minio/paygate-lakehouse
              mc anonymous set none minio/paygate-exports
              mc anonymous set none minio/paygate-audit
              echo "MinIO buckets initialized"
---
# ─── Lakehouse V2 ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-lakehouse-v2
  namespace: paygate
  labels:
    app: paygate-lakehouse-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paygate-lakehouse-v2
  template:
    metadata:
      labels:
        app: paygate-lakehouse-v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8125"
        prometheus.io/path: "/metrics"
    spec:
