---
# Settlement Forecast Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-settlement-forecast
  namespace: paygate
  labels:
    app: paygate-settlement-forecast
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paygate-settlement-forecast
  template:
    metadata:
      labels:
        app: paygate-settlement-forecast
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9011"
    spec:
      containers:
        - name: settlement-forecast
          image: paygate/settlement-forecast:latest
          ports:
            - containerPort: 9011
          env:
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: PG_DATABASE_URL
            - name: PORT
              value: "9011"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: paygate-settlement-forecast
  namespace: paygate
spec:
  selector:
    app: paygate-settlement-forecast
  ports:
    - port: 9011
      targetPort: 9011
