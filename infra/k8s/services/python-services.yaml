# Fraud Scoring Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-fraud-scoring
  namespace: paygate
  labels:
    app: paygate-fraud-scoring
spec:
  replicas: 3
  selector:
    matchLabels:
      app: paygate-fraud-scoring
  template:
    metadata:
      labels:
        app: paygate-fraud-scoring
    spec:
      containers:
        - name: fraud-scoring
          image: paygate/fraud-scoring:latest
          ports:
            - containerPort: 9010
          env:
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: PG_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: paygate-secrets
                  key: REDIS_URL
            - name: PORT
              value: "9010"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: paygate-fraud-scoring
  namespace: paygate
spec:
  selector:
    app: paygate-fraud-scoring
  ports:
    - port: 9010
      targetPort: 9010
