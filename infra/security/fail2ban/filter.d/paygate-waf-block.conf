# Fail2Ban filter for open-appsec WAF blocked requests
[Definition]
failregex = .*"waf_action":"block".*"remote_addr":"<HOST>".*
            .*"remote_addr":"<HOST>".*"waf_action":"block".*
            .*"status":403.*"X-openappsec-v".*"remote_addr":"<HOST>".*
ignoreregex =
datepattern = %%Y-%%m-%%dT%%H:%%M:%%S
