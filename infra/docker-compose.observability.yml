# PayGate Observability Stack
# Prometheus + Grafana + Alertmanager + Node Exporter
# Usage: docker compose -f docker-compose.yml -f docker-compose.waf.yml -f docker-compose.observability.yml up -d

version: "3.9"

networks:
  paygate-net:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  tempo_data:
  loki_data:
  novu_mongodb_data:

services:
  # ─── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: paygate-prometheus
    restart: unless-stopped
    networks: [paygate-net]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/paygate-alerts.yml:/etc/prometheus/paygate-alerts.yml:ro
      - ./prometheus/alert-rules.yaml:/etc/prometheus/alert-rules.yaml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: paygate-grafana
    restart: unless-stopped
    networks: [paygate-net]
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/paygate-waf-dashboard.json:/var/lib/grafana/dashboards/paygate-waf-dashboard.json:ro
      - ./grafana/paygate-sip-dashboard.json:/var/lib/grafana/dashboards/paygate-sip-dashboard.json:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=PayGate@Grafana2026
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      - GF_SECURITY_X_CONTENT_TYPE_OPTIONS=true
      - GF_SECURITY_X_XSS_PROTECTION=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://grafana.paygate.internal
      - GF_SMTP_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on: [prometheus]
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Alertmanager ───────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: paygate-alertmanager
    restart: unless-stopped
    networks: [paygate-net]
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - alertmanager_data:/alertmanager
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY required for novu-bridge webhook auth}
    command:
      - '/bin/sh'
      - '-c'
      - 'sed "s|__INTERNAL_API_KEY__|$${INTERNAL_API_KEY}|g" /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml && alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager'
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Node Exporter ──────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: paygate-node-exporter
    restart: unless-stopped
    networks: [paygate-net]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      resources:
        limits:
          memory: 64M

  # ─── Redis Exporter ─────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: paygate-redis-exporter
    restart: unless-stopped
    networks: [paygate-net]
    environment:
      - REDIS_ADDR=redis://redis:6379
    deploy:
      resources:
        limits:
          memory: 32M
  # ─── Tempo (trace backend) ─────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.1
    container_name: paygate-tempo
    restart: unless-stopped
    networks: [paygate-net]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API
      - "4317"        # OTLP gRPC ingest (internal)
      - "4318"        # OTLP HTTP ingest (internal)
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Loki (log aggregation) ────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.8
    container_name: paygate-loki
    restart: unless-stopped
    networks: [paygate-net]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Promtail (log shipping → Loki) ────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.8
    container_name: paygate-promtail
    restart: unless-stopped
    networks: [paygate-net]
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── Novu OSS stack (alert fan-out, spec §6/§7) ────────────────────────────
  novu-mongodb:
    image: mongo:6.0.14
    container_name: paygate-novu-mongodb
    restart: unless-stopped
    networks: [paygate-net]
    volumes:
      - novu_mongodb_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M

  novu-api:
    image: ghcr.io/novuhq/novu/api:0.24.0
    container_name: paygate-novu-api
    restart: unless-stopped
    networks: [paygate-net]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_URL: mongodb://novu-mongodb:27017/novu-db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${NOVU_JWT_SECRET:?must be set — no default Novu JWT secret allowed}
      STORE_ENCRYPTION_KEY: ${NOVU_STORE_ENCRYPTION_KEY:?must be set — no default Novu encryption key allowed}
      API_ROOT_URL: ${NOVU_API_URL:-http://novu-api:3000}
      DISABLE_USER_REGISTRATION: "true"
    depends_on: [novu-mongodb]
    deploy:
      resources:
        limits:
          memory: 512M

  novu-worker:
    image: ghcr.io/novuhq/novu/worker:0.24.0
    container_name: paygate-novu-worker
    restart: unless-stopped
    networks: [paygate-net]
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://novu-mongodb:27017/novu-db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${NOVU_JWT_SECRET:?must be set}
      STORE_ENCRYPTION_KEY: ${NOVU_STORE_ENCRYPTION_KEY:?must be set}
      API_ROOT_URL: ${NOVU_API_URL:-http://novu-api:3000}
    depends_on: [novu-api]
    deploy:
      resources:
        limits:
          memory: 512M

  novu-ws:
    image: ghcr.io/novuhq/novu/ws:0.24.0
    container_name: paygate-novu-ws
    restart: unless-stopped
    networks: [paygate-net]
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: "3002"
      MONGO_URL: mongodb://novu-mongodb:27017/novu-db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${NOVU_JWT_SECRET:?must be set}
      API_ROOT_URL: ${NOVU_API_URL:-http://novu-api:3000}
    depends_on: [novu-api]
    deploy:
      resources:
        limits:
          memory: 256M
