##############################################################################
# PayGate Observability Stack — Docker Compose
# Provides: Grafana, Tempo (traces), Prometheus (metrics), Loki (logs)
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f infra/docker-compose.observability.yml up
#
# Grafana UI: http://localhost:3001 (admin / paygate_grafana_2026)
# Prometheus:  http://localhost:9090
# Tempo:       http://localhost:3200
# Loki:        http://localhost:3100
##############################################################################

version: "3.9"

services:

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: paygate-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: paygate_grafana_2026
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - paygate_network
    depends_on:
      - prometheus
      - tempo
      - loki

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: paygate-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - paygate_network

  # ── Tempo (Distributed Tracing) ───────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.2
    container_name: paygate-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP  ← OTEL_EXPORTER_OTLP_ENDPOINT should point here
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - tempo_data:/var/tempo
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    networks:
      - paygate_network

  # ── Loki (Log Aggregation) ────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: paygate-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - loki_data:/loki
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
    networks:
      - paygate_network

  # ── Promtail (Log Shipper) ────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: paygate-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - paygate_network
    depends_on:
      - loki

  # ── OTEL Collector (optional aggregation layer) ───────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: paygate-otel-collector
    restart: unless-stopped
    ports:
      - "4319:4317"   # OTLP gRPC (collector)
      - "4320:4318"   # OTLP HTTP (collector)
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter
    volumes:
      - ./otel-collector/otel-collector.yml:/etc/otel-collector/config.yml:ro
    command: ["--config=/etc/otel-collector/config.yml"]
    networks:
      - paygate_network
    depends_on:
      - tempo
      - prometheus

volumes:
  grafana_data:
  prometheus_data:
  tempo_data:
  loki_data:

networks:
  paygate_network:
    external: true
    name: paygate_network
