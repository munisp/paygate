  # ─── MinIO Object Store (S3-compatible lakehouse storage) ──────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: paygate-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_SITE_NAME: paygate-lakehouse
    volumes:
      - minio-data:/data
    networks: [paygate-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # MinIO bucket initialisation (runs once, creates paygate-lakehouse bucket)
  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: paygate-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/paygate-lakehouse &&
        mc mb --ignore-existing local/paygate-exports &&
        mc anonymous set download local/paygate-exports &&
        echo 'MinIO buckets ready'
      "
    networks: [paygate-net]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ─── Apache Spark 3.5 (Delta Lake + Sedona) ──────────────────────────────────
  spark-master:
    image: bitnami/spark:3.5.3
    container_name: paygate-spark-master
    restart: unless-stopped
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8086:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC
    volumes:
      - spark-logs:/opt/bitnami/spark/logs
    networks: [paygate-net]
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

