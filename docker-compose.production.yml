version: '3.9'

# ═══════════════════════════════════════════════════════════════════
# PayGate Merchant Portal — Full Production Docker Compose Stack
# Services: App, PostgreSQL, Redis, Qdrant, FalkorDB, Kafka,
#           Temporal, Keycloak, MinIO, Nginx + all Python microservices
# ═══════════════════════════════════════════════════════════════════

x-python-defaults: &python-defaults
  restart: unless-stopped
  networks: [paygate]
  environment:
    LOG_LEVEL: ${LOG_LEVEL:-info}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:-paygate_internal_dev_key_2026}
  healthcheck:
    test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s

  credit-scoring:
    build:
      context: ./python-services/credit-scoring
      dockerfile: Dockerfile
    container_name: paygate-credit-scoring-py
    restart: unless-stopped
    environment:
      - PORT=8115
      - PG_DATABASE_URL=${PG_DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-paygate-internal-dev-key-2026}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
    ports:
      - "8115:8115"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - paygate
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8115/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  paygate:
    driver: bridge
  # keycloak-admin: internal-only network for Keycloak Admin Console.
  # The Admin Console (port 8080) is NOT exposed to the host.
  # Access via SSH tunnel: ssh -L 18080:keycloak:8080 <bastion-host>
  keycloak-admin:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  falkordb_data:
  kafka_data:
  zookeeper_data:
  keycloak_data:
  minio_data:
  nginx_logs:

services:

  # ─── Core App ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paygate_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PG_DATABASE_URL: ${PG_DATABASE_URL:-postgresql://paygate:paygate_dev_2026@postgres:5432/paygate_prod}
      REDIS_URL: ${REDIS_URL:-redis://:redis_dev_2026@redis:6379}
      JWT_SECRET: ${JWT_SECRET:-paygate_jwt_secret_change_in_production_2026_min32chars}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QDRANT_URL: http://qdrant:6333
      FALKORDB_URL: redis://falkordb:6379
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-paygate-prod}
      FRAUD_SCORING_URL: http://fraud-scoring:8000
      VECTOR_STORE_URL: http://vector-store:8000
      KNOWLEDGE_GRAPH_URL: http://knowledge-graph:8000
      ART_REASONING_URL: http://art-reasoning:8000
      COCOINDEX_URL: http://cocoindex:8000
      LAKEHOUSE_AI_URL: http://lakehouse-ai:8000
      AI_INSIGHTS_URL: http://ai-insights:8000
      AML_MONITOR_URL: http://aml-monitor:8000
      SETTLEMENT_FORECAST_URL: http://settlement-forecast:8000
      GNN_FRAUD_URL: http://gnn-fraud:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-paygate_internal_dev_key_2026}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-PayGate Merchant Portal}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      SMTP_HOST: ${SMTP_HOST:-smtp.mailgun.org}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-postmaster@paygate.ng}
      SMTP_PASS: ${SMTP_PASS:-smtp_password_placeholder}
      NIBSS_GATEWAY_URL: ${NIBSS_GATEWAY_URL:-https://nibss-gateway.paygate.ng}
      NIBSS_INSTITUTION_CODE: ${NIBSS_INSTITUTION_CODE:-000001}
      NIBSS_SECRET_KEY: ${NIBSS_SECRET_KEY:-nibss_secret_placeholder}
      MOJALOOP_URL: ${MOJALOOP_URL:-https://mojaloop.paygate.ng}
      MOJALOOP_API_KEY: ${MOJALOOP_API_KEY:-mojaloop_key_placeholder}
      PAYMENT_LINK_BASE_URL: ${PAYMENT_LINK_BASE_URL:-https://pay.paygate.ng}
      MERCHANT_PORTAL_URL: ${MERCHANT_PORTAL_URL:-https://portal.paygate.ng}
      YOUVERIFY_API_KEY: ${YOUVERIFY_API_KEY:-youverify_key_placeholder}
      TERMII_API_KEY: ${TERMII_API_KEY:-termii_key_placeholder}
      NIP_API_KEY: ${NIP_API_KEY:-nip_key_placeholder}
      # ─── Keycloak OIDC ─────────────────────────────────────────────────────────────────────
      # Required for on-premise auth. Run scripts/keycloak-bootstrap.sh once
      # after first startup to provision the realm, client, and admin user.
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-paygate}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-merchant-portal}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change_me_run_bootstrap_script}
      # Keycloak Admin credentials for the nightly realm backup job
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_WEBHOOK_SECRET: ${KEYCLOAK_WEBHOOK_SECRET:-}
      # Comma-separated list of allowed redirect origins (e.g. https://portal.acme.com)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [paygate]
  # ─── PostgreSQL ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: paygate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paygate_prod}
      POSTGRES_USER: ${POSTGRES_USER:-paygate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paygate_dev_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paygate} -d ${POSTGRES_DB:-paygate_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [paygate]

  # ─── PgBouncer ────────────────────────────────────────────────────────────────
  # Connection pooler — sits between the application servers and PostgreSQL.
  # Reduces connection overhead under high concurrency by multiplexing connections.
  # All services that previously connected directly to postgres:5432 should use
  # pgbouncer:6432 instead in production.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1
    container_name: paygate_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-paygate}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-paygate_dev_2026}
      DB_NAME: ${POSTGRES_DB:-paygate_prod}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      SERVER_IDLE_TIMEOUT: "600"
      CLIENT_IDLE_TIMEOUT: "0"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      AUTH_TYPE: scram-sha-256
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:-paygate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [paygate]
  # ─── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: paygate_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_2026} --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [paygate]

  # ─── Qdrant Vector Store ──────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: paygate_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [paygate]

  # ─── FalkorDB (Graph DB for KG/EPR-KGQA) ─────────────────────────
  falkordb:
    image: falkordb/falkordb:latest
    container_name: paygate_falkordb
    restart: unless-stopped
    ports:
      - "${FALKORDB_PORT:-6380}:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [paygate]

  # ─── Zookeeper ────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: paygate_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks: [paygate]

  # ─── Kafka ────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: paygate_kafka
    restart: unless-stopped
    depends_on: [zookeeper]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [paygate]

  # ─── Temporal Workflow Engine ─────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: paygate_temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-paygate}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-paygate_dev_2026}
      POSTGRES_SEEDS: postgres
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-paygate-prod}
    networks: [paygate]

  # ─── Temporal UI ──────────────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: paygate_temporal_ui
    restart: unless-stopped
    depends_on: [temporal]
    ports:
      - "${TEMPORAL_UI_PORT:-8082}:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    networks: [paygate]

  # ─── Keycloak Identity Provider ───────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: paygate_keycloak
    restart: unless-stopped
    # start-dev: suitable for on-premise internal networks.
    # For internet-facing deployments, switch to `start` and configure KC_HOSTNAME.
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-paygate_prod}
      KC_DB_USERNAME: ${POSTGRES_USER:-paygate}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-paygate_dev_2026}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_2026}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # ── SMTP (password-reset / email-verification emails) ──────────
      # Leave KC_SMTP_HOST empty to disable email sending (e.g. in dev).
      # Set all four vars to enable Keycloak's built-in SMTP sender.
      KC_SMTP_HOST: ${KC_SMTP_HOST:-}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-587}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-no-reply@paygate.local}
      KC_SMTP_FROM_DISPLAY_NAME: ${KC_SMTP_FROM_DISPLAY_NAME:-PayGate Identity}
      KC_SMTP_USER: ${KC_SMTP_USER:-}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
      KC_SMTP_SSL: ${KC_SMTP_SSL:-false}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:-true}
      KC_SMTP_AUTH: ${KC_SMTP_AUTH:-true}
      # ── Webhook secret for event listener SPI ─────────────────────
      # This value must match KEYCLOAK_WEBHOOK_SECRET in the portal .env.
      # Generate with: openssl rand -hex 32
      KEYCLOAK_WEBHOOK_SECRET: ${KEYCLOAK_WEBHOOK_SECRET:-}
    # Port 8080 is intentionally NOT exposed to the host.
    # Uncomment the line below ONLY for initial bootstrap / emergency access:
    # ports:
    #   - "127.0.0.1:${KEYCLOAK_PORT:-18080}:8080"
    # Health-check: poll /health/ready so dependent services (portal, bootstrap
    # script) only start once Keycloak is fully initialised and serving OIDC.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keycloak_data:/opt/keycloak/data
      # Mount realm JSON so Keycloak auto-imports it on first start (--import-realm).
      # The realm is only imported if it does not already exist.
      - ./keycloak/paygate-realm.json:/opt/keycloak/data/import/paygate-realm.json:ro
    networks:
      - paygate
      - keycloak-admin
    # NOTE: Port 8080 (Admin Console) is NOT exposed to the host.
    # The portal reaches Keycloak via the internal Docker network (http://keycloak:8080).
    # To access Admin Console: ssh -L 18080:localhost:8080 <bastion-ip>
    # then open http://localhost:18080/admin

  # ─── MinIO (S3-compatible Lakehouse storage) ──────────────────────
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: paygate_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_access_key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_key_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [paygate]

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: paygate_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on: [app]
    networks: [paygate]

  # ─── Python: Fraud Scoring (GNN/ML) ──────────────────────────────
  fraud-scoring:
    <<: *python-defaults
    build:
      context: ./python-services/fraud-scoring
      dockerfile: Dockerfile
    container_name: paygate_fraud_scoring
    ports:
      - "${FRAUD_SCORING_PORT:-8100}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-paygate_internal_dev_key_2026}
      QDRANT_URL: http://qdrant:6333
      FALKORDB_URL: redis://falkordb:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  # ─── Python: GNN Fraud Detection (GraphSAGE) ──────────────────────
  gnn-fraud:
    <<: *python-defaults
    build:
      context: ./python-services/gnn-fraud
      dockerfile: Dockerfile
    container_name: paygate_gnn_fraud
    ports:
      - "${GNN_FRAUD_PORT:-8102}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-paygate_internal_dev_key_2026}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRAUD_SCORING_URL: http://fraud-scoring:8000
      FALKORDB_URL: redis://falkordb:6379
      GNN_MODEL_VERSION: ${GNN_MODEL_VERSION:-v1.0.0}
      GNN_FRAUD_THRESHOLD: ${GNN_FRAUD_THRESHOLD:-0.7}
      GNN_RING_THRESHOLD: ${GNN_RING_THRESHOLD:-0.85}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Python: Vector Store (Qdrant) ───────────────────────────────
  vector-store:
    <<: *python-defaults
    build:
      context: ./python-services/vector-store
      dockerfile: Dockerfile
    container_name: paygate_vector_store
    ports:
      - "${VECTOR_STORE_PORT:-8101}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-paygate_internal_dev_key_2026}
      QDRANT_URL: http://qdrant:6333

  # ─── Python: Knowledge Graph (FalkorDB + EPR-KGQA) ───────────────
  knowledge-graph:
    <<: *python-defaults
    build:
      context: ./python-services/knowledge-graph
      dockerfile: Dockerfile
    container_name: paygate_knowledge_graph
    ports:
      - "${KNOWLEDGE_GRAPH_PORT:-8102}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-paygate_internal_dev_key_2026}
      FALKORDB_URL: redis://falkordb:6379

  # ─── Python: ART Reasoning Engine ────────────────────────────────
  art-reasoning:
    <<: *python-defaults
    build:
      context: ./python-services/art-reasoning
      dockerfile: Dockerfile
    container_name: paygate_art_reasoning
    ports:
      - "${ART_REASONING_PORT:-8103}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-paygate_internal_dev_key_2026}
      FRAUD_SCORING_URL: http://fraud-scoring:8000
      VECTOR_STORE_URL: http://vector-store:8000
      KNOWLEDGE_GRAPH_URL: http://knowledge-graph:8000

  # ─── Python: CocoIndex ETL Pipeline ──────────────────────────────
  cocoindex:
    <<: *python-defaults
    build:
      context: ./python-services/cocoindex
      dockerfile: Dockerfile
    container_name: paygate_cocoindex
    ports:
      - "${COCOINDEX_PORT:-8104}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-paygate_internal_dev_key_2026}
      QDRANT_URL: http://qdrant:6333
      PG_DATABASE_URL: ${PG_DATABASE_URL:-postgresql://paygate:paygate_dev_2026@postgres:5432/paygate_prod}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  # ─── Python: Lakehouse AI Orchestrator ───────────────────────────
  lakehouse-ai:
    <<: *python-defaults
    build:
      context: ./python-services/lakehouse-ai
      dockerfile: Dockerfile
    container_name: paygate_lakehouse_ai
    ports:
      - "${LAKEHOUSE_AI_PORT:-8105}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-paygate_internal_dev_key_2026}
      FRAUD_SCORING_URL: http://fraud-scoring:8000
      VECTOR_STORE_URL: http://vector-store:8000
      KNOWLEDGE_GRAPH_URL: http://knowledge-graph:8000
      ART_REASONING_URL: http://art-reasoning:8000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_access_key}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret_key_2026}
      S3_ENDPOINT_URL: http://minio:9000
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-paygate-lakehouse}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  # ─── Python: AI Insights ──────────────────────────────────────────
  ai-insights:
    <<: *python-defaults
    build:
      context: ./python-services/ai-insights
      dockerfile: Dockerfile
    container_name: paygate_ai_insights
    ports:
      - "${AI_INSIGHTS_PORT:-8106}:8000"

  # ─── Python: AML Monitor ─────────────────────────────────────────
  aml-monitor:
    <<: *python-defaults
    build:
      context: ./python-services/aml-monitor
      dockerfile: Dockerfile
    container_name: paygate_aml_monitor
    ports:
      - "${AML_MONITOR_PORT:-8107}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-paygate_internal_dev_key_2026}
      PG_DATABASE_URL: ${PG_DATABASE_URL:-postgresql://paygate:paygate_dev_2026@postgres:5432/paygate_prod}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  # ─── Python: Settlement Forecast ─────────────────────────────────
  settlement-forecast:
    <<: *python-defaults
    build:
      context: ./python-services/settlement-forecast
      dockerfile: Dockerfile
