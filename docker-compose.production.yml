    restart: unless-stopped
    command: >
      sh -c "if [ ! -f /var/lib/tigerbeetle/0_0.tigerbeetle ]; then
               tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /var/lib/tigerbeetle/0_0.tigerbeetle;
             fi &&
             tigerbeetle start --addresses=0.0.0.0:3000 /var/lib/tigerbeetle/0_0.tigerbeetle"
    ports:
      - "${TIGERBEETLE_PORT:-3001}:3000"
    volumes:
      - tigerbeetle_data:/var/lib/tigerbeetle
    networks: [paygate]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Permify Fine-Grained Authorization ─────────────────────────────
  permify:
    image: ghcr.io/permify/permify:v0.9.6
    container_name: paygate_permify
    restart: unless-stopped
    command: serve
    ports:
      - "${PERMIFY_PORT:-3476}:3476"
      - "${PERMIFY_GRPC_PORT:-3478}:3478"
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: ${PG_DATABASE_URL:-postgresql://paygate:paygate_dev_2026@postgres:5432/paygate_prod}
      PERMIFY_DATABASE_MAX_OPEN_CONNECTIONS: "20"
      PERMIFY_SERVER_RATE_LIMIT: "100"
      PERMIFY_LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [paygate]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3476/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Fluvio Real-Time Streaming ───────────────────────────────────────
  fluvio:
    image: infinyon/fluvio:0.11.11
    container_name: paygate_fluvio
    restart: unless-stopped
    ports:
      - "${FLUVIO_PORT:-9003}:9003"
    volumes:
      - fluvio_data:/var/lib/fluvio
    networks: [paygate]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9003 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  opensearch-indexer:
    build:
      context: ./python-services/opensearch-indexer
      dockerfile: Dockerfile
    image: paygate/opensearch-indexer:latest
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_USER: ${OPENSEARCH_USER:-admin}
      OPENSEARCH_PASS: ${OPENSEARCH_PASS:-admin}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8003:8003"
    networks:
      - paygate
    healthcheck:
      test: ["CMD-SHELL", "python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy


  # ─── Ollama LLM Server ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.3.14
    container_name: paygate-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama/models
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=2
    networks:
      - paygate-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G


volumes:
  nifi_data:
  nifi_logs:
  airflow_logs:
  dbt_logs:
  tigerbeetle_data:
  fluvio_data:
  ollama_models:
