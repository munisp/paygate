version: "3.9"

services:
  deepface-sidecar:
    build: .
    image: paygate-deepface-sidecar:latest
    container_name: paygate-deepface-sidecar
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - DEEPFACE_SIDECAR_PORT=5050
      - DEEPFACE_LOG_LEVEL=INFO
      # Uncomment to connect to pgvector for persistent embedding storage:
      # - DEEPFACE_DB_URL=${PG_DATABASE_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
