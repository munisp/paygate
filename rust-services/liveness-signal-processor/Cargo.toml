[package]
name = "liveness-signal-processor"
version = "1.0.0"
edition = "2021"
description = "PayGate Liveness Signal Processor — Fourier, LBP, colour-depth, anti-spoof classification"

[[bin]]
name = "liveness-signal-processor"
path = "src/main.rs"

[dependencies]

# OpenTelemetry (OTEL_IMPLEMENTATION_SPEC §5)
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"
axum            = { version = "0.7", features = ["json", "macros"] }
tokio           = { version = "1",   features = ["full"] }
serde           = { version = "1",   features = ["derive"] }
serde_json      = "1"
rayon           = "1.10"
image           = "0.25"
base64          = "0.22"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http      = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }
tower           = "0.4"
thiserror       = "1"
anyhow          = "1"
uuid            = { version = "1", features = ["v4"] }
# FFT — pure Rust, no C deps
rustfft         = "6"
# Statistics
statrs          = "0.17"
# HTTP client (for callback to Node.js)
reqwest         = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[profile.release]
opt-level       = 3
lto             = true
codegen-units   = 1
panic           = "abort"
