[package]
name = "credit-scoring"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "credit-scoring"
path = "src/main.rs"

[lib]
name = "credit_scoring"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

# OpenTelemetry (OTEL_IMPLEMENTATION_SPEC §5)
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
actix-web = "4"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Apache DataFusion — in-process SQL analytics engine (Rust-native)
# Used for batch credit feature extraction from Parquet/CSV datasets on S3/MinIO
# CSV support is built into DataFusion 43 (the standalone "csv" feature was removed long ago)
datafusion = { version = "43", features = ["parquet"] }

# Async runtime (required by DataFusion)
tokio = { version = "1", features = ["full"] }

# Arrow columnar format (DataFusion's native format)
arrow = { version = "53", features = ["prettyprint"] }
arrow-schema = "53"
arrow-array = "53"

# Parquet file I/O
parquet = { version = "53", features = ["async"] }

# Object store (S3/MinIO) for reading Parquet from lakehouse
object_store = { version = "0.11", features = ["aws"] }

# URL parsing for object store config
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
