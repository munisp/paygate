[package]
name = "cross-border-fraud-engine"
version = "1.0.0"
edition = "2021"
description = "PayGate Cross-Border Fraud Scoring Engine — CIPS/UPI/PIX risk rules"
authors = ["PayGate Engineering <engineering@paygate.io>"]

[[bin]]
name = "cross-border-fraud-engine"
path = "src/main.rs"

[dependencies]
# HTTP server
actix-web = "4"
actix-rt = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# UUID
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Regex
regex = "1"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
