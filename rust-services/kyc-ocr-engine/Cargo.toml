[package]
name = "kyc-ocr-engine"
version = "1.0.0"
edition = "2021"
description = "PayGate KYC Rust OCR Engine — high-throughput parallel document processing"

[[bin]]
name = "kyc-ocr-engine"
path = "src/main.rs"

[dependencies]

# OpenTelemetry (OTEL_IMPLEMENTATION_SPEC §5)
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"
axum = { version = "0.7", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Tesseract OCR bindings (requires libtesseract-dev on host)
leptess = "0.14"
# Image processing
image = "0.25"
# HTTP utilities
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
