[package]
name = "billing-engine"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "billing-engine"
path = "src/main.rs"

[lib]
name = "billing_engine"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
actix-web = "4"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
