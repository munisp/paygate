[package]
name = "insider-threat-engine"
version = "1.0.0"
edition = "2021"
description = "PayGate Insider Threat Behavioural Analytics Engine"

[[bin]]
name = "insider-threat-engine"
path = "src/main.rs"

[lib]
name = "insider_threat_engine"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]

# OpenTelemetry (OTEL_IMPLEMENTATION_SPEC §5)
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
actix-web = "4"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dashmap = "6"         # concurrent hash map for actor baselines
statrs = "0.17"       # statistical distributions for Z-score
