name: Liveness Noise-Fix Gate

# Runs on every PR that touches liveness-related code, and on pushes to main/develop.
# Blocks merge if any of the noise-fix regression tests fail.

on:
  push:
    branches: [main, develop, "release/**"]
    paths:
      - "server/routers/**"
      - "server/routers.ts"
      - "client/src/pages/LivenessCheck.tsx"
      - "mobile/react-native/src/components/LivenessCamera.tsx"
      - "server/*.test.ts"
  pull_request:
    branches: [main, develop]
    paths:
      - "server/routers/**"
      - "server/routers.ts"
      - "client/src/pages/LivenessCheck.tsx"
      - "mobile/react-native/src/components/LivenessCamera.tsx"
      - "server/*.test.ts"

concurrency:
  group: liveness-noise-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ─── 1. Liveness Noise-Fix Unit Tests ────────────────────────────────────────
  liveness-unit:
    name: Liveness Noise-Fix Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://paygate:paygate_test@localhost:3306/paygate_test
      JWT_SECRET: test-jwt-secret-for-ci-only
      NODE_ENV: test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: paygate_test
          MYSQL_USER: paygate
          MYSQL_PASSWORD: paygate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push DB schema
        run: pnpm db:push
        env:
          DATABASE_URL: mysql://paygate:paygate_test@localhost:3306/paygate_test

      - name: Run liveness noise-fix tests
        run: pnpm exec vitest run --reporter=verbose server/liveness.noise.test.ts
        # Falls back to full suite if the dedicated file doesn't exist yet
        continue-on-error: false

      - name: Run full Vitest suite (regression guard)
        run: pnpm exec vitest run --reporter=verbose
        continue-on-error: false

  # ─── 2. TypeScript Compile Check ─────────────────────────────────────────────
  typecheck:
    name: TypeScript Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check (server + client)
        run: pnpm exec tsc --noEmit

  # ─── 3. Multi-Frame API Contract Check ───────────────────────────────────────
  api-contract:
    name: Multi-Frame API Contract
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify checkLiveness accepts multiFrameB64 and qualityHint
        run: |
          node -e "
          const fs = require('fs');
          const routers = fs.readFileSync('server/routers.ts', 'utf8');
          const checks = [
            ['multiFrameB64', 'multiFrameB64 field in checkLiveness schema'],
            ['qualityHint',   'qualityHint field in checkLiveness schema'],
            ['noiseLevel',    'noiseLevel in qualityHint schema'],
            ['ensemble',      'ensemble scoring logic'],
          ];
          let allPassed = true;
          for (const [term, desc] of checks) {
            if (!routers.includes(term)) {
              console.error('FAIL: Missing ' + desc + ' (' + term + ')');
              allPassed = false;
            } else {
              console.log('PASS: Found ' + desc);
            }
          }
          process.exit(allPassed ? 0 : 1);
          "

      - name: Verify web LivenessCheck uses captureMultipleFrames
        run: |
          node -e "
          const fs = require('fs');
          const liveness = fs.readFileSync('client/src/pages/LivenessCheck.tsx', 'utf8');
          const checks = [
            ['captureMultipleFrames', 'captureMultipleFrames function'],
            ['computeQualityHint',    'computeQualityHint function'],
            ['multiFrameB64',         'multiFrameB64 in mutation payload'],
            ['qualityHint',           'qualityHint in mutation payload'],
          ];
          let allPassed = true;
          for (const [term, desc] of checks) {
            if (!liveness.includes(term)) {
              console.error('FAIL: Missing ' + desc + ' (' + term + ')');
              allPassed = false;
            } else {
              console.log('PASS: Found ' + desc);
            }
          }
          process.exit(allPassed ? 0 : 1);
          "

      - name: Verify React Native LivenessCamera uses multi-frame ensemble
        run: |
          node -e "
          const fs = require('fs');
          const rn = fs.readFileSync('mobile/react-native/src/components/LivenessCamera.tsx', 'utf8');
          const checks = [
            ['captureMultipleFrames', 'captureMultipleFrames function'],
            ['estimateNoiseLevel',    'estimateNoiseLevel function'],
            ['multiFrameB64',         'multiFrameB64 in mutation payload'],
            ['qualityHint',           'qualityHint in mutation payload'],
          ];
          let allPassed = true;
          for (const [term, desc] of checks) {
            if (!rn.includes(term)) {
              console.error('FAIL: Missing ' + desc + ' (' + term + ')');
              allPassed = false;
            } else {
              console.log('PASS: Found ' + desc);
            }
          }
          process.exit(allPassed ? 0 : 1);
          "

  # ─── 4. Gate Summary ─────────────────────────────────────────────────────────
  gate:
    name: Liveness Noise-Fix Gate — PASSED
    runs-on: ubuntu-latest
    needs: [liveness-unit, typecheck, api-contract]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.liveness-unit.result }}" != "success" ]]; then
            echo "GATE FAILED: liveness-unit tests did not pass"
            exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "GATE FAILED: TypeScript type-check did not pass"
            exit 1
          fi
          if [[ "${{ needs.api-contract.result }}" != "success" ]]; then
            echo "GATE FAILED: API contract check did not pass"
            exit 1
          fi
          echo "All liveness noise-fix gate checks passed ✓"
