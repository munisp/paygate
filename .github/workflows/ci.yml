name: CI — PayGate Merchant Portal

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  GO_VERSION: "1.23"
  RUST_VERSION: "stable"
  PYTHON_VERSION: "3.11"

jobs:
  # ─── 1. Lint & Type-check ────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm exec tsc --noEmit

      - name: Lint (ESLint)
        run: pnpm lint --max-warnings 0
        continue-on-error: true

      - name: Format check (Prettier)
        run: pnpm exec prettier --check .
        continue-on-error: true

  # ─── 2. Unit & Integration Tests ────────────────────────────────────────────
  test:
    name: Vitest Suite
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paygate
          POSTGRES_PASSWORD: paygate_test
          POSTGRES_DB: paygate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://paygate:paygate_test@localhost:5432/paygate_test
      JWT_SECRET: test-jwt-secret-for-ci-only
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:push
        env:
          DATABASE_URL: postgresql://paygate:paygate_test@localhost:5432/paygate_test

      - name: Run test suite
        run: pnpm test --reporter=verbose --coverage
        env:
          DATABASE_URL: postgresql://paygate:paygate_test@localhost:5432/paygate_test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ─── 3. Go Bridge Build & Vet ────────────────────────────────────────────────
  go-bridge:
    name: Go Bridge (Build & Vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go-bridge/go.sum

      - name: Download Go modules
        working-directory: go-bridge
        run: go mod download

      - name: go vet
        working-directory: go-bridge
        run: go vet ./...

      - name: Build Go bridge
        working-directory: go-bridge
        run: go build -o /tmp/go-bridge-bin ./cmd/bridge

      - name: Run Go tests
        working-directory: go-bridge
        run: go test ./... -v -timeout 60s
        continue-on-error: true

  # ─── 4. Rust / DataFusion Build ──────────────────────────────────────────────
  rust-services:
    name: Rust Services (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-services/credit-scoring
            rust-services/billing-engine

      - name: Build credit-scoring (DataFusion)
        working-directory: rust-services/credit-scoring
        run: cargo build --release
        continue-on-error: true

      - name: Clippy credit-scoring
        working-directory: rust-services/credit-scoring
        run: cargo clippy -- -D warnings
        continue-on-error: true

      - name: Test credit-scoring
        working-directory: rust-services/credit-scoring
        run: cargo test
        continue-on-error: true

      - name: Build billing-engine
        working-directory: rust-services/billing-engine
        run: cargo build --release
        continue-on-error: true

  # ─── 5. Python Services Lint & Test ──────────────────────────────────────────
  python-services:
    name: Python Services (Lint & Test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - fraud-scoring
          - fraud-heatmap
          - lakehouse-audit
          - lakehouse-v2
          - usdc-lakehouse-consumer
          - cohort-analytics
          - settlement-forecast
          - ai-insights
          - reconciliation-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies for ${{ matrix.service }}
        working-directory: python-services/${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then
            # Install only lightweight deps for CI (skip heavy ML/Spark packages)
            grep -v "pyspark\|apache-sedona\|delta-spark\|torch\|tensorflow" requirements.txt \
              | pip install -r /dev/stdin || true
          fi

      - name: Lint ${{ matrix.service }} with flake8
        working-directory: python-services/${{ matrix.service }}
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.git,__pycache__,*.egg-info
        continue-on-error: true

      - name: Syntax check ${{ matrix.service }}
        working-directory: python-services/${{ matrix.service }}
        run: python -m py_compile main.py && echo "Syntax OK"

  # ─── 6. Production Build ─────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [test, go-bridge]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_OAUTH_PORTAL_URL: ${{ secrets.VITE_OAUTH_PORTAL_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─── 7. Playwright E2E Tests ─────────────────────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paygate
          POSTGRES_PASSWORD: paygate_test
          POSTGRES_DB: paygate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://paygate:paygate_test@localhost:5432/paygate_test
      JWT_SECRET: test-jwt-secret-for-ci-only
      NODE_ENV: test
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run database migrations
        run: pnpm db:push

      - name: Start dev server
        run: pnpm dev &
        env:
          DATABASE_URL: postgresql://paygate:paygate_test@localhost:5432/paygate_test

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=html
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─── 8. Docker Build Validation ──────────────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        service:
          - fraud-scoring
          - fraud-heatmap
          - lakehouse-v2
          - cohort-analytics
          - settlement-forecast
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} Docker image
        uses: docker/build-push-action@v5
        with:
          context: python-services/${{ matrix.service }}
          push: false
          tags: paygate/${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # ─── 9. Security Audit ───────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies for vulnerabilities
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  # ─── 10. K8s Manifest Validation ─────────────────────────────────────────────
  k8s-validate:
    name: K8s Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          wget -qO /tmp/kubeval.tar.gz \
            https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar -xzf /tmp/kubeval.tar.gz -C /usr/local/bin
        continue-on-error: true

      - name: Validate K8s manifests
        run: |
          find infra/k8s -name "*.yaml" | xargs kubeval --ignore-missing-schemas 2>&1 || true
        continue-on-error: true

      - name: Validate docker-compose
        run: |
          pip install pyyaml -q
          python3 -c "
          import yaml, sys
          with open('infra/docker-compose.prod.yml') as f:
            doc = yaml.safe_load(f)
          print(f'docker-compose valid: {len(doc[\"services\"])} services')
          "
