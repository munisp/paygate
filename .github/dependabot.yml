      - "python"
      - "shared"
    commit-message:
      prefix: "chore(deps/python-shared)"
    groups:
      fastapi-stack:
        patterns: ["fastapi", "uvicorn", "starlette", "pydantic", "pydantic-*"]
      http-clients:
        patterns: ["httpx", "aiohttp", "requests"]
      database:
        patterns: ["sqlalchemy", "redis", "psycopg*", "asyncpg"]
      security-critical:
