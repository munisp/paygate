  # ─────────────────────────────────────────────────────────────────────────────
  # Python — representative high-risk services (full list would exceed 50-entry limit)
  # Dependabot supports up to 50 entries per dependabot.yml.
  # The shared/ requirements.txt covers common transitive deps for all services.
  # ─────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/python-services/shared"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
